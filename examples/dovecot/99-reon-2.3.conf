# Ubuntu 24.04 / Dovecot 2.3 counterpart of 99-reon.conf.
# Keep protocol behaviour equal: Maildir, device-key APOP, gated USER/PASS,
# delivery shaping, webmail access and non-destructive POP3 deletion.
mail_location = maildir:/var/vmail/%u
mail_home = /var/vmail/%u
mail_uid = vmail
mail_gid = vmail
auth_username_format = %n
auth_mechanisms = apop cram-md5 plain login
disable_plaintext_auth = no
!include /etc/dovecot/dovecot-sql.conf.ext
passdb {
  driver = sql
  args = /etc/dovecot/reon-auth-sql.conf.ext
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/vmail/%u
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
plugin {
  sieve_plugins = sieve_extprograms
  sieve_extensions = +vnd.dovecot.filter
  sieve_filter_bin_dir = /opt/reon/mail/sieve-filters
  sieve_before = /etc/dovecot/sieve/reon-delivery.sieve
}
service lmtp {
  vsz_limit = 1 G
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 10143
  }
  inet_listener imaps {
    port = 0
  }
}
pop3_deleted_flag = "$DeletedByGame"
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 0
  }
}
service doveadm {
  unix_listener doveadm-server {
    mode = 0660
    user = reon
    group = reon
  }
}
service auth {
  unix_listener auth-userdb {
    mode = 0660
    user = reon
    group = reon
  }
}
import_environment = $import_environment DOVECOT_HOSTNAME
