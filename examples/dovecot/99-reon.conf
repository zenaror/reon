# REON: o Dovecot passa a ser o dono do armazenamento de correspondência.
#
# O MySQL continua sendo o diretório de contas -- é o que autentica e o que o
# local_recipient_maps do Postfix já consulta -- mas deixa de guardar mensagem.
# Essa é a estrutura que o servidor do REONTeam usa, e a ideia é encaixar o
# nosso nela, não o contrário.
#
# Duas escolhas que divergem do arquivo deles, ambas de propósito:
#
#   Maildir em vez de mbox. O mbox tranca o arquivo inteiro a cada escrita, e
#   aqui há entrega (LMTP), leitura pelo nosso POP3 e leitura pelo webmail ao
#   mesmo tempo. Com poucas contas e um leitor só, mbox passa; com três
#   leitores concorrentes, é corrupção esperando acontecer. É uma linha para
#   voltar atrás, e nada acima do Dovecot enxerga a diferença.
#
#   Usuário virtual único (vmail) em vez de conta de sistema por jogador. A
#   configuração deles guarda em /var/mail/%u, o que exige um usuário Unix por
#   pessoa; com treze contas ainda vai, com trezentas não.
# Nota: o 20-lmtp.conf já tira o domínio antes da consulta
# (auth_username_format dentro do filtro de protocolo), então a conta que
# chega aqui é a parte local -- que é como ela está no banco.

mail_driver = maildir
mail_path = /var/vmail/%{user}
# O padrão do Debian aponta a INBOX para /var/mail/%{user} -- herança do
# tempo em que cada jogador seria um usuário Unix. Esvaziado para a INBOX
# morar dentro de mail_path, como o resto das pastas.
mail_inbox_path =
mail_home = /var/vmail/%{user}
mail_uid = vmail
mail_gid = vmail

!include /etc/dovecot/dovecot-sql.conf.ext

# A senha é a do jogo (log_in_password), em claro, porque o protocolo do
# APOP (RFC 1939) é como o Game Boy autentica: o servidor manda um nonce no
# banner, o adaptador devolve MD5(banner + segredo), e o segredo nunca cruza o
# fio. Quem faz essa conta é o ADAPTADOR, não o cartucho -- é por isso que aqui
# cabe um segredo de 256 bits, coisa que o caminho HTTP do jogo nunca vai poder
# ter, porque lá quem calcula é o ROM de 2001.
#
# SÓ apop e cram-md5. Sem plain, sem login: a libmobile é nossa, então dá para
# exigir o mecanismo forte, do mesmo jeito que se exigia o XAPOP. Deixar
# USER/PASS ligado ao lado seria oferecer ao atacante a porta de oito
# caracteres ao lado da de 256 bits -- ele escolhe a de oito.
#
# cram-md5 vem de graça: mesmo armazenamento, mesma consulta, HMAC-MD5 em vez
# de MD5 cru. É o degrau seguinte, sem precisar mexer no servidor de novo.
#
# Pendente, cosmético: o desafio termina em @<fqdn> da máquina e hoje anuncia o
# nome da instância na nuvem. A opção `hostname` governa outro campo; o certo é
# DOVECOT_HOSTDOMAIN via bloco import_environment.
auth_mechanisms = apop cram-md5 plain login

# O segredo é a chave de device-auth: 32 bytes, um por conta (a tabela tem
# UNIQUE em user_id), servida em hexa como {PLAIN} porque APOP e CRAM-MD5
# precisam do segredo em claro do lado do servidor para refazer a conta.
#
# A conta que chega aqui é a parte local: o 20-lmtp.conf e o login tiram o
# domínio antes da consulta.
#
# ATENÇÃO: na 2.4 o rótulo do bloco é o NOME da passdb, e dois blocos com o
# mesmo nome são FUNDIDOS num só -- não viram duas passdb em cadeia. Uma
# segunda, de compatibilidade com o log_in_password de 8 caracteres, ficaria
# assim, e está desligada de propósito:
#
#   passdb legado {
#     driver = sql
#     sql_driver = mysql
#     default_password_scheme = PLAIN
#     query = SELECT dion_email_local AS user, log_in_password AS password \
#             FROM sys_users WHERE dion_email_local = '%{user|username}'
#     result_failure = continue
#   }
#
# e a primeira precisaria de `result_failure = continue` para a cadeia andar.
passdb sql {
  # Na 2.4 o driver e dito aqui, e nao deduzido do bloco de conexao.
  sql_driver = mysql
  default_password_scheme = PLAIN
  # Uma consulta so, que escolhe o segredo pelo mecanismo -- e nao duas
  # passdb, porque na 2.4 o rotulo do bloco E o espaco de nomes das opcoes:
  # dois blocos `passdb sql` sao FUNDIDOS num so, e um bloco com outro nome
  # nao encontra as opcoes (`passdb_legado_query` nao existe).
  #
  # APOP e CRAM-MD5 recebem a chave de device-auth, 32 bytes em hexa.
  # USER/PASS recebe a senha de oito caracteres, e SO enquanto o servidor
  # aceitar esse degrau -- o interruptor mora no banco e nao aqui, para quem
  # administra ligar e desligar pelo painel sem editar /etc nem recarregar
  # nada. Desligado, a coluna volta NULL e o Dovecot recusa.
  #
  # LEFT JOIN de proposito: conta sem chave de device-auth ainda tem que
  # conseguir entrar por senha enquanto o degrau estiver aberto.
  # A coluna NUNCA volta NULL e a linha NUNCA some, e isso nao e detalhe: o
  # doveadm resolve o usuario por esta mesma passdb, entao uma consulta que
  # nao devolve linha (ou devolve senha nula) nao apenas recusa o login --
  # deixa a caixa inteira ilegivel, webmail junto. Quando o degrau esta
  # fechado a senha vira '*', que nao casa com nada e nao quebra ninguem.
  query = SELECT u.dion_email_local AS user, \
          CASE \
            WHEN '%{mechanism}' IN ('APOP', 'CRAM-MD5') \
              THEN coalesce(lower(hex(d.device_auth_key)), '*') \
            WHEN coalesce((SELECT s.value FROM sys_settings s \
                            WHERE s.name = 'pop3_password_fallback'), '1') = '1' \
              THEN coalesce(u.log_in_password, '*') \
            ELSE '*' \
          END AS password \
          FROM sys_users u \
          LEFT JOIN sys_device_authorization d ON d.user_id = u.id \
          WHERE u.dion_email_local = '%{user|username}'
}

# Sem consulta: todas as caixas têm o mesmo dono e o caminho sai do nome.
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /var/vmail/%{user}
  }
}

# As tratativas do Game Boy, na entrega.
#
# Elas moravam no RETR do nosso POP3. Quem vai atender o jogo passa a ser o
# Dovecot, que serve os bytes guardados e nao tem gancho de leitura na 2.4 --
# entao a unica hora em que ainda da para moldar a mensagem e quando ela
# chega. O programa chamado e o mesmo gameFormat.js que o POP3 usa, nao um
# parecido: e isso que garante que o jogo veja os mesmos bytes venha por onde
# vier, enquanto os dois caminhos convivem.
#
# So no LMTP: o IMAP e o doveadm nao passam por aqui, e nao devem.
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

# Blocos, e nao listas com "+": na 2.4 `sieve_extensions = +x` nao acrescenta,
# SUBSTITUI o conjunto inteiro -- o que apagou ate o `envelope`, que e padrao,
# e fez o script inteiro parar de compilar.
sieve_plugins {
  sieve_extprograms = yes
}
sieve_extensions {
  vnd.dovecot.filter = yes
}
sieve_filter_bin_dir = /opt/reon/mail/sieve-filters

# `before` e nao `personal`: e regra da casa, roda antes de qualquer script de
# usuario e nao depende de ninguem ter um.
# LIGADO. As tratativas do Game Boy acontecem aqui, na entrega, e nao mais no
# RETR do nosso POP3 -- que passou a servir os bytes guardados, como o Dovecot
# fara quando assumir a 110 (shaped_at_delivery no config.json).
#
# Os dois andam juntos: desligar este bloco sem desligar aquela chave faz o
# jogo receber mensagem CRUA, com Received e Return-Path, e nada reclama. Foi
# o que aconteceu uma vez, por empurrar este arquivo com o bloco comentado.
sieve_script reon {
  type = before
  driver = file
  path = /etc/dovecot/sieve/reon-delivery.sieve
}

service lmtp {
  # O filtro de entrega e um processo Node, e o V8 reserva muito mais espaco
  # de enderecamento virtual do que os 256 MB que o default_vsz_limit da aos
  # filhos. Sob esse teto ele aborta com SIGTRAP antes de executar uma linha
  # -- a entrega seguia (a falha do filtro e aberta), mas calada e sem
  # tratativa nenhuma, que e o pior dos dois mundos.
  #
  # Espaco VIRTUAL reservado, nao memoria usada: o processo real fica na casa
  # das dezenas de MB e vive milissegundos. O teto continua existindo, so
  # deixou de ser menor que o piso do interpretador.
  vsz_limit = 1 G

  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# A 110 é pública: é por ela que o Mobile Adapter busca correio, e desde
# 12/09/2026 quem atende é o Dovecot.
#
# As outras escutas NÃO são públicas, e quem as fecha é o firewall, não esta
# linha: na 2.4 o endereço é global -- não existe `address` por inet_listener,
# o parser recusa. O firewall abre 110, 25, 80, 443, 22, 31227 e 5453/udp, e
# rejeita o resto, então o IMAP na 10143 continua inalcançável de fora mesmo
# escutando em todas as interfaces. Se alguém abrir portas no firewall, é aí
# que precisa olhar para cá de novo.
listen = *

service imap-login {
  inet_listener imap {
    port = 10143
  }
  inet_listener imaps {
    port = 0
  }
}

# O DELE do POP3 nao pode destruir.
#
# O Mobile Trainer nao tem modo "deixar no servidor": todos os caminhos dele
# apagam, e um deles apaga SEM ter baixado. Com o padrao do Dovecot, DELE
# expunge no QUIT e a mensagem some para sempre -- inclusive uma que ninguem
# leu. Com a flag, o DELE so marca: o Dovecot esconde a marcada das sessoes
# POP3 seguintes, e ela continua existindo para o site mostrar e restaurar.
#
# O nome e o mesmo que o nosso POP3 ja usava para dizer quem apagou, entao os
# dois caminhos marcam a mesma coisa do mesmo jeito.
pop3_deleted_flag = $DeletedByGame

# A porta 110, que fala com o Game Boy. Era do nosso POP3 e passou a ser do
# Dovecot em 12/09/2026 -- o `disable_pop3` no config.json é o outro lado
# dessa troca, e os dois precisam andar juntos: se este bloco voltar para a
# 10110 sem aquele desligar, ninguém atende a porta e o jogo fica sem correio.
#
# O que era nosso e sobreviveu à troca: as tratativas foram para o filtro de
# entrega (Sieve), o DELE não-destrutivo virou pop3_deleted_flag acima, e a
# autenticação virou APOP com a chave de device-auth.
service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 0
  }
}



# O nosso POP3 roda como `reon` e consulta as caixas pelo doveadm, que por
# sua vez pergunta ao auth do Dovecot quem é o usuário. Esse socket é só do
# root por padrão, e sem isto toda consulta falha em "Auth USER lookup
# failed" -- que é o que o serviço faz o tempo todo, para todas as contas.
# Ler a caixa de OUTRA conta exige privilégio que o usuário do serviço não
# tem -- e não deve ter. Então ele não lê: pede. O doveadm-server roda dentro
# do Dovecot, que é quem tem o privilégio, e o nosso POP3 fala com ele por
# este socket. É a mesma ideia do auxiliar de serviços do painel: quem pode
# não é quem pede.
service doveadm {
  unix_listener doveadm-server {
    mode = 0660
    user = reon
    group = reon
  }
}

service auth {
  unix_listener auth-userdb {
    mode = 0660
    user = reon
    group = reon
  }
}
