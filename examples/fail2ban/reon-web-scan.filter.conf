# fail2ban filter: web scanners probing for files no real visitor asks for.
#
# Matches an nginx access-log line whose REQUEST PATH is one of the well-known
# scanner targets (.env and .git files, phpunit's eval-stdin, WordPress,
# phpMyAdmin, phpinfo, cgi-bin traversal, exposed admin/actuator endpoints...).
# The status code is deliberately ignored: a legitimate visitor never asks for
# these, whatever the answer was.
#
# What is NOT matched, on purpose: a plain 404 or a burst of 404s (Game Boy
# adapters legitimately ask for files that do not exist, and several consoles
# can sit behind one address behind carrier NAT), and a bare "../" or "%2e%2e"
# in a path (the team probes /cgb/%2e%2e/... on purpose, and it is how real
# clients may address pages). /cgi-bin/mgb/ and /api/ are real paths of this
# site, so /cgi-bin/ is matched only when it carries a traversal. Only path
# patterns that nothing here serves are used.
#
# Written against the standard "combined" log format:
#   1.2.3.4 - - [28/Sep/2026:12:48:01 +0000] "GET /.env HTTP/2.0" 404 ...

[Definition]
# fail2ban removes the timestamp before matching, hence the empty [].
_req = ^<HOST> \S+ \S+ \[\] "\S+

failregex = %(_req)s \S*/\.(?:env|git|aws|svn|ssh|htpasswd|DS_Store)\S* HTTP/\S+"
            %(_req)s \S*(?:eval-stdin\.php|/vendor/phpunit|/phpunit/)\S* HTTP/\S+"
            %(_req)s \S*/(?:wp-(?:admin|login|content|includes|json)|xmlrpc\.php|wordpress)\S* HTTP/\S+"
            %(_req)s \S*/(?:phpmyadmin|phpMyAdmin|pma|myadmin|adminer)\S* HTTP/\S+"
            %(_req)s /(?:_?php_?info|phpinfo|pinfo|sysinfo|info)\.php\S* HTTP/\S+"
            %(_req)s /cgi-bin/\S*(?:%%2e|\.){2}\S* HTTP/\S+"
            %(_req)s /cgi-bin/\S*%%%%32%%65\S* HTTP/\S+"
            %(_req)s /(?:config\.(?:json|js|php|ya?ml)|hello\.world|actuator\S*|server-status|boaform\S*|HNAP1\S*|solr\S*|jenkins\S*|manager/html)(?:\?\S*)? HTTP/\S+"

ignoreregex =
