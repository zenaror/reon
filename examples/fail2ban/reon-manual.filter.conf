# fail2ban filter for the manual jail: it never matches anything.
#
# reon-manual holds the bans an administrator adds by hand from the admin panel
# (Bans). Nothing is detected here -- the jail exists so that such bans have a
# place to live, with their own ports and length, separate from the automatic
# jails. The pattern below cannot occur in the (empty) log the jail watches.
[Definition]
failregex = ^REON-MANUAL-BANS-NEVER-MATCH <HOST>$
ignoreregex =
