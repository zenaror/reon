# Jail para o POP3 do jogo. Instalar em /etc/fail2ban/jail.d/.
#
# Os números abaixo foram escolhidos para errar sempre a favor do jogador. O
# que se está banindo é ruído de catálogo da internet, não ataque -- em
# 11/09/2026 foram 54 conexões de varredura e zero autenticações. Nada aqui
# protege contra algo que estivesse conseguindo entrar; isto limpa log.
#
# maxretry alto de propósito: um varredor manda vários comandos desconhecidos
# na mesma visita, então alcança 5 sem esforço, enquanto um cliente legítimo
# não produz NENHUM acerto da regra -- ele só fala os onze comandos da lista.
# O número existe para absorver o caso que eu não previ, não para calibrar
# sensibilidade.
#
# bantime de uma hora, e não permanente: um IP de nuvem é reciclado entre
# inquilinos, e banir para sempre o endereço de hoje é banir o jogador de
# amanhã que alugou a mesma máquina. Uma hora corta a visita sem herdar o
# problema.

# ATUALIZADO em 12/09/2026: a porta 110 passou a ser atendida pelo Dovecot, e
# o filtro `reon-pop3` lia o journal do reon-mail -- que nao serve mais POP3.
# Um jail apontado para um servico que nao fala mais nada nao protege nada e
# nao reclama: fica com "Total failed: 0" para sempre, parecendo saudavel.
#
# Passou a usar o filtro `dovecot` que ja vem com o fail2ban. Muda a regra: em
# vez de "mandou comando fora do vocabulario", agora e "falhou autenticacao".
# O varredor que manda CAPA/STLS/GET deixa de ser banido -- ele so enche log,
# e o Dovecot loga menos que o nosso servidor logava.
#
# maxretry mais alto que os 5 de antes, de proposito: durante a troca para
# APOP, um adaptador com chave velha erra a autenticacao varias vezes seguidas
# tentando de novo, e banir o jogador por isso e trocar um problema de
# configuracao por um problema que parece rede.
[reon-pop3]
enabled  = true
filter   = dovecot
backend  = systemd
port     = 110
protocol = tcp

maxretry = 10
findtime = 10m
bantime  = 1h

# A rede do próprio servidor nunca é banida: o webmail e os scripts de
# manutenção falam com o POP3 por localhost, e um erro de digitação num teste
# não pode trancar a porta do serviço para ele mesmo.
ignoreip = 127.0.0.1/8 ::1
