# fail2ban jail: web scanners (see filter.d/reon-web-scan.conf). Install in
# /etc/fail2ban/jail.d/.
#
# What this bans is internet noise, not an attack that was getting anywhere:
# scanners asking this site for .env files, phpunit, WordPress and the like,
# hundreds of times a day. Nothing here protects something that was being
# broken into; it keeps the log readable and stops one address from filling
# the PHP workers.
#
# These patterns match requests for known sensitive files and scanner targets.
# A single match is sufficient to ban the source address.
#
# The ban starts at a day and doubles for repeat offenders (up to a week)
# instead of being permanent: cloud addresses are recycled between tenants,
# and banning today's address forever bans tomorrow's legitimate player who
# rents the same machine.
#
# Only the web ports are blocked; SSH and the game's other services are not
# touched by this jail.
[reon-web-scan]
enabled  = true
filter   = reon-web-scan
port     = http,https
logpath  = /var/log/nginx/reon.access.log

maxretry = 1
findtime = 10m
bantime  = 1d
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 1w

# The server's own network is never banned (local scripts and the webmail
# talk to the site over localhost).
ignoreip = 127.0.0.1/8 ::1
