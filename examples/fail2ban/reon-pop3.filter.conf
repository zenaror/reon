# Filtro do jail reon-pop3: falha de AUTENTICACAO no POP3 do Dovecot.
#
# Por que nao o filtro `dovecot` que vem com o fail2ban: o Dovecot 2.4 registra
# a falha assim,
#
#   pop3-login: Login aborted: Logged out (auth failed, 2 attempts in 6 secs)
#   (auth_failed): user=<x>, method=APOP, rip=203.0.113.9, lip=..., session=<..>
#
# e o `mdre-normal` do filtro de fabrica so conhece "Aborted login",
# "Disconnected" e afins (fail2ban 1.1.0). Com ele o jail ficou "saudavel" e
# com "Total failed: 0" enquanto as falhas passavam -- medido com
# fail2ban-regex contra uma linha real, em 29/09/2026.
#
# O que conta: so "(auth failed, N attempts ...) (auth_failed)". A linha
# "(no auth attempts ...)" -- conexao que abre e fecha sem tentar nada, o que
# varredores e um adaptador com rede ruim fazem -- NAO conta, para nao banir
# jogador por queda de conexao.
#
# Para conferir depois de mexer aqui:
#   fail2ban-regex systemd-journal reon-pop3
[INCLUDES]
before = common.conf

[Definition]
failregex = ^pop3-login: Login aborted: .*\(auth failed, \d+ attempts? in \d+ secs\) \(auth_failed\).*\brip=<HOST>,

ignoreregex =

journalmatch = _SYSTEMD_UNIT=dovecot.service
