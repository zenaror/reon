# APOSENTADO em 12/09/2026. Mantido no repositorio pelo que ele documenta.
#
# Este filtro lia o journal do reon-mail.service, o nosso servidor POP3. Desde
# que o Dovecot assumiu a porta 110 ele nao tem mais o que casar: o jail passou
# a usar o filtro `dovecot`, que vem com o fail2ban (ver reon-pop3.jail.conf).
#
# O raciocinio abaixo continua valendo caso um dia volte a existir um servidor
# POP3 nosso, e a medicao de 11/09 e o unico registro que temos do volume de
# varredura naquela porta.
#
# Quem fala com o POP3 do REON sem falar POP3 do REON.
#
# A porta 110 é aberta para a internet por necessidade: é por ela que o Mobile
# Adapter GB busca o correio, e o adaptador não fala outra coisa. O preço é ser
# varrido o dia inteiro por quem cataloga a internet -- Censys, Stretchoid,
# projetos de pesquisa e quem procura alvo.
#
# A regra NÃO é "conectou e não autenticou". Essa puniria justamente o
# adaptador com conexão ruim, que cai antes de terminar o login e voltaria
# banido. É lista de PERMISSÃO: conta como falha qualquer comando que não
# pertença ao vocabulário do jogo.
#
# Por que isso é seguro para o adaptador: ele só sabe falar os onze comandos
# abaixo. Ou manda um deles, e não casa com a regra, ou a conexão morre antes
# de mandar qualquer coisa, e aí não há linha de comando nenhuma para casar.
# Não existe caminho em que um cliente legítimo seja pego.
#
# Por que envelhece bem: o próximo varredor vai inventar um comando novo, e já
# está coberto. Uma lista de proibição precisaria adivinhar qual.
#
# O APOP entrou na lista em 12/09/2026, quando o servidor passou a aceitá-lo:
# sem isso, o adaptador que autentica do jeito novo seria contado como
# varredor e banido por uma hora depois de cinco tentativas. A lista de
# permissão tem que crescer junto com o vocabulário do servidor -- é o preço
# de ela ser lista de permissão, e vale pagar.
#
# Medido em 11/09/2026: os varredores mandaram CAPA, STLS, AUTH, GET, OPTIONS
# e fragmentos de uma letra. Nenhum mandou um único comando que o servidor
# implementa, e nenhuma sessão real mandou algo fora da lista.

[Definition]

# Duas formas da mesma linha, porque o log acrescenta o nome da conta depois
# de um login clássico bem-sucedido:
#   (POP3) 1.2.3.4:5678: CAPA
#   (POP3) 1.2.3.4:5678 (conta): PASS
_prefix = \(POP3\) <HOST>:\d+(?: \([^)]*\))?:

# \b depois do grupo evita que "USERNAME" passe por ser prefixado por "USER".
_allowed = USER|PASS|APOP|XAPOP|XPROVISION|STAT|LIST|TOP|RETR|DELE|RSET|QUIT

failregex = ^%(_prefix)s (?!(?:%(_allowed)s)\b)\S+

# Conexão e desconexão nunca contam: é delas que vive um adaptador instável.
ignoreregex = ^\(POP3\) (CONNECTED|DISCONNECTED):

[Init]
journalmatch = _SYSTEMD_UNIT=reon-mail.service
