# fail2ban jail: bans added by hand from the admin panel (Bans). Install in
# /etc/fail2ban/jail.d/, with filter.d/reon-manual.conf and an empty log file
# at /var/log/reon/manual-bans.log (3-harden-server.sh does all three).
#
# Every ban here has a reason, written down in the panel by whoever made it;
# fail2ban itself only knows the address, so the reason lives in the site's
# database.
#
# Blocks the web and mail ports, not SSH: a mistyped address on this page must
# not be able to lock the administrators out of the machine.
#
# 30 days, then it lapses by itself; the panel lifts it earlier on request. Not
# permanent, for the same reason as reon-web-scan: cloud addresses are recycled
# between tenants. (fail2ban keeps bans in its database only for dbpurgeage --
# see fail2ban.d/reon-dbpurge.local -- so a ban survives a restart of fail2ban
# for as long as this bantime.)
[reon-manual]
enabled  = true
filter   = reon-manual
port     = http,https,smtp,submission,pop3,pop3s,imap,imaps
logpath  = /var/log/reon/manual-bans.log
backend  = polling

maxretry = 1
findtime = 1d
bantime  = 30d

ignoreip = 127.0.0.1/8 ::1
