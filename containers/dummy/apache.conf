<VirtualHost *:80>
DocumentRoot /var/www/reon/web/htdocs
<Directory /var/www/reon/web/htdocs>
Require all granted
Options -Indexes +FollowSymLinks
DirectoryIndex index.php
RewriteEngine On
RewriteRule ^cgb/download/([0-9]{2})/CGB-BXT([JE])/([0-9])room([0-9]{4})$ /cgb/download/$1/CGB-BXT$2/$3room.php?room=$4 [L,QSA]
RewriteRule ^cgb/download/([0-9]{2})/CGB-BXT([JE])/([0-9])leaders([0-9]{4})$ /cgb/download/$1/CGB-BXT$2/$3leaders.php?room=$4 [L,QSA]
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{REQUEST_FILENAME}.php -f
RewriteRule ^(cgb/.*)$ $1.php [L]
RewriteRule ^cgb/download/?$ /cgb/download.php [L]
</Directory>
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined
</VirtualHost>
