name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/full_server ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, feature/full_server ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
  
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dummy-server

      - name: Build SDK for protocol smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dummy-server
          load: true
          tags: reon-dummy-smoke:ci
          cache-from: type=gha

      - name: Check simulated services
        run: |
          mkdir -p /tmp/reon-sdk-fixtures
          docker run -d --name reon-sdk-smoke \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:2525:2525 \
            -p 127.0.0.1:1110:1110 -p 127.0.0.1:5353:5353/udp \
            -v /tmp/reon-sdk-fixtures:/content:ro reon-dummy-smoke:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/_sdk/health && break
            sleep 1
          done
          python3 containers/dummy/smoke-test.py --content /tmp/reon-sdk-fixtures

      - name: Remove smoke container
        if: always()
        run: docker rm -fv reon-sdk-smoke || true

      # Publish the lightweight SDK after the smoke gate.
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dummy-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
