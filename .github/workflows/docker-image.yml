name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/full_server ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, feature/full_server ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
  
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dummy-server

      - name: Extract website image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dummy-web

      - name: Build Dummy server email and DNS
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dummy-server
          load: true
          tags: localhost/reon-dummy-server:local
          cache-from: type=gha

      - name: Build the real REON Dummy server website
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dummy-web
          load: true
          tags: localhost/reon-dummy-web:local
          cache-from: type=gha

      - name: Check real signup and simulated mail
        run: |
          bash containers/dummy/stack.sh init
          printf '%s\n' DUMMY_HTTP_PORT=8080 DUMMY_SMTP_PORT=2525 DUMMY_SUBMISSION_PORT=2587 DUMMY_POP3_PORT=1110 DUMMY_DNS_PORT=5354 >> containers/dummy/.env
          docker compose --env-file containers/dummy/.env -p reon-dummy -f containers/dummy/compose.yml up -d --no-build
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          python3 containers/dummy/flow-test.py

      - name: Remove test stack
        if: always()
        run: docker compose --env-file containers/dummy/.env -p reon-dummy -f containers/dummy/compose.yml down -v || true

      # Publish the lightweight Dummy server after the smoke gate.
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dummy-server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the real REON Dummy server website
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dummy-web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
