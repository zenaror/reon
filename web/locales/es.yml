  news-maker-date: Sale el
  news-maker-date-hint: El día en que este número toma el relevo, y sigue saliendo hasta que llega el día de otro. Eliges el mes y el día; el año es el actual, así que un día que aún no ha llegado espera en vez de salir ahora. Febrero se detiene en 28, porque un día 29 solo existiría en un año bisiesto.
