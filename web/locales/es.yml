auth:
  login-to-reon: Inicia sesión en tu cuenta REON
  invalid-email-pass: Correo electrónico o contraseña incorrectos
  signup-to-reon: Regístrate en REON
  i-agree-terms: Acepto los términos de uso y la política de privacidad
  you-must-agree: Debes aceptar
  registration-email-sent: Si aún no estás registrado, se envió un correo con un enlace para continuar tu registro a la dirección especificada.
  registration-complete: Tu registro se ha completado.
  reon-username: "Usuario REON"
  reon-username-hint: "De 3 a 20 caracteres, solo letras minúsculas y números."
  reon-username-invalid: "Usuario inválido o ya en uso"
  reon-username-mail-note: "Este nombre también será tu dirección de correo REON, usada por los juegos:"
  reon-username-mail-internal: "Desde la Game Boy"
  reon-username-mail-external: "Desde internet"
  reon-username-taken: "Ese nombre ya está en uso: elige otro."
  reon-username-free: "Ese nombre está disponible."
  reon-username-mail-or: "o"
  reon-username-mail-truncated: "La Game Boy solo admite 8 caracteres, así que la dirección dentro del juego es tu nombre de usuario acortado: ambas llegan al mismo buzón."
  region-explanation-para1: REON permite el intercambio internacional para jugadores de Pokémon Cristal, a través de la función del juego llamada Trade Corner. Esto incluye intercambios entre juegos japoneses y no japoneses, que normalmente son incompatibles por usar distintos conjuntos de caracteres. Para hacer posibles estos intercambios, el servicio cambia los apodos de los Pokémon, los nombres de Entrenador y los mensajes escritos en el Correo al emparejar Pokémon entre juegos japoneses y no japoneses (por ejemplo, cambiando "A" por "ア", y viceversa). Estos cambios son irreversibles, pero buscan imitar la escritura del idioma original de la forma más fiel posible.
  region-explanation-para2: Elige el conjunto de regiones con las que aceptas intercambiar. Este ajuste también se puede cambiar después del registro.
  rankings-explanation-para1: "Cuando juegas a Pokémon Crystal con el adaptador, el juego nos envía tu puntuación junto con el nombre, la edad y el estado que escribiste en el juego, más un mensaje corto que armaste con la lista de palabras del propio juego. Esa parte no es opcional: el juego la necesita para funcionar, y la guardamos igualmente."
  rankings-explanation-para2: "Esta casilla es sobre los demás jugadores. Marcada, tu nombre, tu región y tu mensaje aparecen en las listas de clasificación — las de este sitio y las que muestra el propio juego. Vacía, tu puntuación sigue contando para ti, pero nadie más ve quién eres."
  rankings-explanation-para3: "Puedes cambiar de idea cuando quieras, en la página de tu cuenta, y funciona en los dos sentidos: desactivarla oculta lo que ya está ahí, activarla lo devuelve. Una excepción: si la edad configurada en tu juego es menor de 13, te dejamos fuera de las clasificaciones sin importar esta casilla."
  rankings-opt-in-check: "Sí, quiero aparecer en las clasificaciones"
  rankings-opt-in-optional: "Opcional — puedes terminar el registro de cualquier forma."
  birth-date-explanation-para1: "La pedimos para saber si tienes edad para aparecer en las clasificaciones públicas. Aparecer allí muestra tu edad, tu género, tu región y tu nombre de golpe a todos los demás jugadores — el juego lo imprime en una línea — así que no es algo para activar en el caso de un niño."
  birth-date-explanation-para2: "Nunca se muestra a nadie, y nada más en el sitio la usa. Puedes dejarla vacía y terminar el registro igual: las clasificaciones solo quedan cerradas hasta que la rellenes, y puedes hacerlo después en la página de tu cuenta. Tampoco es lo mismo que la edad que escribes dentro del juego: esa la manda el cartucho por su cuenta, y nadie la comprueba."

