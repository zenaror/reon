  title: "Tu pasaporte a REON."
  download-hint: "Haz clic aquí para descargar"
  intro: "Este archivo es tu pasaporte para acceder a los servicios de REON."
  body-1: "Ya sea que te conectes mediante emulación con mGBA o usando hardware original, este pequeño archivo de configuración contiene la información que tu juego necesita para encontrar y conectarse a REON."
  body-2: "Piensa en él como el vínculo entre tu juego y la red REON. Una vez que mobile_config.bin esté instalado en el lugar correcto, los juegos y programas compatibles pueden usarlo para conectarse a los servidores de REON y acceder a sus funciones en línea."
  mgba-heading: "¿Juegas con mGBA?"
  mgba-body: "¡Es fácil empezar! Descarga mobile_config.bin y luego consulta la Guía de configuración de mGBA. Te guiaremos paso a paso por el proceso."
  hardware-heading: "¿Juegas en hardware original?"
  hardware-body: "¡También puedes conectarte a REON desde la consola real! Consulta la Guía de configuración para hardware original para saber qué necesitas y cómo conectarte."
  keep-heading: "¡No pierdas tu pasaporte!"
  keep-body: "Guarda una copia de mobile_config.bin en un lugar seguro. Podrías necesitarla de nuevo si configuras REON en otro dispositivo o reinstalas tu emulador."
