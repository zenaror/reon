  news-maker-withdrawn: Retirado. El juego no volverá a usarlo.
  news-maker-withdraw-confirm: ¿Sacar este número del calendario y borrar lo compilado? Deja de salir, pero la fila de noticias conserva su contenido hasta que las noticias normales roten esa región, que es cuando el programador vuelve a copiarlas.
