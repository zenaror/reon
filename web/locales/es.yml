  news-maker-title: Pokémon News
  news-maker-intro: Un número de la revista es un pequeño programa que el juego ejecuta, montado con las herramientas reales. Tú eliges las palabras, los rankings y el minijuego; todo lo demás viene de un número que se sabe que funciona.
