  body-1: "Ya sea que te conectes mediante emulación con mGBA o usando hardware original, este pequeño archivo de configuración contiene la información que tu juego necesita para encontrar y conectarse a REON."
  body-2: "Piensa en él como el vínculo entre tu juego y la red REON. Una vez que mobile_config.bin esté instalado en el lugar correcto, los juegos y programas compatibles pueden usarlo para conectarse a los servidores de REON y acceder a sus funciones en línea."
