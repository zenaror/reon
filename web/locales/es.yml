  news-maker-built: Compilado para
  news-maker-not-built: sin compilar
  news-maker-name: Nombre
  news-maker-name-hint: Para ti y para el nombre del archivo. No se muestra en el juego.
  news-maker-message: Línea del buzón
  news-maker-message-hint: La única línea que el buzón del juego muestra de este número antes de que alguien lo abra. En blanco, se usa el titular de este idioma. Como máximo %n% caracteres, y escrita con los caracteres propios del juego, así que lo que no sabe dibujar se rechaza indicando cuál es.
  news-maker-schedule-locked: Los números se pueden compilar, pero todavía no programar.
  news-maker-schedule-why: 'El calendario de los números propios es un archivo aparte, y el servidor web no puede escribirlo. A propósito no es la configuración que está al lado: esa también guarda el calendario de las noticias normales, que este panel no tiene por qué cambiar:'
  news-maker-built-only: compilado, pero fuera del calendario — ningún jugador lo ve
  month-1: enero
  month-2: febrero
  month-3: marzo
  month-4: abril
  month-5: mayo
  month-6: junio
  month-7: julio
  month-8: agosto
  month-9: septiembre
  month-10: octubre
  month-11: noviembre
  month-12: diciembre
  news-maker-date: Sale el
  news-maker-date-hint: El día en que este número toma el relevo, y sigue saliendo hasta que llega el día de otro. Eliges el mes y el día; el año es el actual, así que un día que aún no ha llegado espera en vez de salir ahora. Febrero se detiene en 28, porque un día 29 solo existiría en un año bisiesto.
  news-maker-withdraw: Retirar
  news-maker-withdrawn: Retirado. El juego no volverá a usarlo.
  news-maker-withdraw-confirm: ¿Sacar este número del calendario y borrar lo compilado? Deja de salir, pero la fila de noticias conserva su contenido hasta que las noticias normales roten esa región, que es cuando el programador vuelve a copiarlas.
