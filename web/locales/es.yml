  trade-option-1: Solo nacional (solo la región de tu juego)
  trade-option-2: Todas las regiones con idiomas compatibles
  trade-option-3: Todas las regiones, incluyendo conversión latino-japonesa
  time-zone: Zona horaria
  time-zone-blurb: Elige la zona horaria en la que se muestran las fechas y horas en el sitio. Deja el valor por defecto para verlo todo en la zona horaria original del juego (Japón, +0900).
  update-settings: Actualizar configuración
  adapter-settings: "Adaptador"
  adapter-color: "Color del adaptador"
  adapter-blurb: "Qué adaptador ven los juegos al leer tu mobile_config.bin. Cambia el color y el nombre que muestra el juego, nada más."
  adapter-unmetered: "Sin tarificación (sin cargo por minuto)"
  adapter-unmetered-explanation: "Le dice al juego que la llamada no se cobra por minuto. En Pokémon Cristal japonés eso quita el límite de tiempo de los combates por móvil. Lo que hace en los demás juegos no se sabe — nadie lo ha documentado —, así que si un juego se comporta de forma extraña con esto activado, desactivarlo es lo primero que conviene probar."
  rankings-opt-in: "Clasificaciones"
  rankings-opt-in-blurb: "Si lo que tu juego envía puede mostrarse a otras personas — en las páginas de clasificación y en la tabla que muestran los juegos. El envío en sí no cambia: el cartucho manda lo que manda, y el servidor lo guarda igualmente."
  rankings-opt-in-on: "Mostrarme en las clasificaciones"
  rankings-opt-in-off: "Dejarme fuera de las clasificaciones"
  rankings-opt-in-note: "Se muestra el nombre que envió tu juego, tu estado o provincia, y el mensaje que el juego te dejó componer con su propia lista de palabras. Desactivarlo también oculta lo que ya está; volver a activarlo lo recupera."
  birth-date: "Fecha de nacimiento"
  birth-date-blurb: "Sirve para una sola cosa: decidir si tus resultados pueden aparecer en las clasificaciones. Nunca se muestra a nadie, y no es lo que envía el juego — el juego tiene su propio campo de edad, que escribes dentro de él. Puedes ponerla una vez; después ya no se puede cambiar."
  birth-date-locked: "Ya guardada — no se puede cambiar. Eliminar la cuenta la borra."
  birth-date-optional: "Opcional — puedes terminar el registro sin ella."
  birth-date-invalid: "Esa fecha no sirve. Revisa el año."
  rankings-blocked-age: "Las clasificaciones están cerradas para esta cuenta: la fecha de nacimiento indica menos de %age% años. Una entrada en la clasificación muestra tu edad, tu género, tu región y tu nombre a todos los demás jugadores; por eso esto no es una elección."
  rankings-reminder: "Estás fuera de las clasificaciones. Lo que tu juego envía se guarda, pero no se muestra a nadie — puedes cambiarlo en"
  rankings-reminder-link: "la página de tu cuenta"
  download-my-data: "Descargar mis datos"
  data-rights-note: "La descarga es todo lo que el servidor guarda sobre esta cuenta, en un único archivo JSON, incluido tu correo. Las claves de dispositivo y el token de relay se mencionan pero no se escriben: son credenciales en uso, y una copia suya en un archivo que llevas contigo es una copia que antes no existía."
  delete-account: "Eliminar cuenta"
  delete-intro: "Esto elimina la cuenta y todo lo que está unido a ella. No se puede deshacer, y no hay plazo de arrepentimiento."
  delete-item-mail: "Todo el correo, en la bandeja de entrada y en la papelera, leído o no."
  delete-item-devices: "Cada dispositivo conectado, con su código de emparejamiento, su contador y su clave."
  delete-item-games: "Lo que registraron los juegos: clasificaciones, resultados de la Torre Batalla, depósitos e intercambios del Trade Corner."
  delete-item-identity: "La cuenta misma, la dirección de juego y el identificador de acceso. Después, otra persona puede tomar esa dirección."
  delete-warning: "El correo ya entregado a otra persona es suyo y se queda con ella — eliminar esta cuenta no alcanza el buzón de nadie más."
  delete-export-first: "Si quieres una copia de algo de esto, llévatela antes de eliminar:"
  delete-type-name: "Escribe %name% para confirmar"
  delete-name-mismatch: "Ese no es el nombre de la cuenta, exactamente como está escrito arriba."
  delete-confirm: "Eliminar esta cuenta definitivamente"
  delete-cancel: "Cancelar"
  delete-failed: "No se eliminó nada — algo falló en el servidor. La cuenta está intacta; inténtalo de nuevo y avisa a un administrador si sigue fallando."
  adapter-color-8: "Azul"
  adapter-color-9: "Amarillo"
  adapter-color-11: "Rojo"
  adapter-following-default: "Todavía no has elegido, así que estos son los valores del sitio."
  adapter-download-note: "El cambio se aplica a la próxima mobile_config.bin que descargues. Un archivo ya en uso sigue funcionando."
  adapter-invalid: "Ese no es un adaptador que el servidor conozca. No se cambió nada."
