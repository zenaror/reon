  trainer-preview: Como la ve la consola
  trainer-preview-note: '160x144 al doble, con la propia tipografía del Trainer, así que una línea corta aquí más o menos donde corta allí. Más o menos: el adaptador usa su propio dibujante, no un navegador.'
  trainer-tags-note: 'De la documentación del adaptador, y esta es la lista completa — <p>, <table> y <form> no están en ella. Nada se rechaza por estar ausente, porque la documentación no dice qué hace el adaptador con una etiqueta que no conoce. Dos sorpresas: <b> pone el texto en rojo en vez de negrita, y <center> solo funciona dentro de <html>. Las imágenes son solo BMP de 1BPP, con cada lado de 255 píxeles como máximo.'
