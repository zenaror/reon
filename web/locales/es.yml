  news-maker-lang-e: inglés
  news-maker-lang-d: alemán
  news-maker-lang-f: francés
  news-maker-lang-i: italiano
  news-maker-lang-s: español
  news-maker-scheduled: En el calendario
  news-maker-template: Basado en
  news-maker-template-hint: El número real cuyos menús, guiones y disposición presta a este.
  news-maker-minigame: Minijuego
  news-maker-publish-now-unbuilt: Esta edición aún no se ha compilado. Ábrela, marca los idiomas y pulsa Publicar primero.
  news-maker-published-now: En el aire ahora en %regions%.
  news-maker-prizes: Premios
  news-maker-prizes-hint: "Lo que el minijuego entrega cuando se gana. La lista se lee del código del propio minijuego, así que cambiar de minijuego cambia la lista. Se ofrece la tabla de objetos entera, objetos clave incluidos: el cartucho los conoce, pero el juego no espera recibir uno de ellos por la noticia."
  news-maker-prize: Premio %n%
  news-maker-prize-default: "tal cual: %item%"
  news-maker-prize-fixed: Lo elige el minijuego.
  news-maker-prize-none: Este minijuego no entrega premio.
  news-maker-bad-prize: "No existe ese objeto:"
  news-maker-headline-hint: 'El nombre del número en la propia pantalla de noticias: en el cartel mientras la consola lo descarga, y como título arriba de la página. Como máximo %n% caracteres, que es lo que usa el número real más ancho.'
  news-maker-body-hint: 'El texto que hay detrás de «Guía de noticias»: el artículo que lee el jugador. Una línea en blanco empieza un párrafo; la primera línea abre el cuadro de texto, la segunda queda debajo y el resto se desplaza. **%n% caracteres por línea**, porque el cuadro mide %n% casillas de ancho. Sin límite de líneas: el texto se desplaza.'
  news-maker-random: RANKING ALEATORIO
  news-maker-ranking-hint: 'Los tres rankings de los que trata este número. «RANKING ALEATORIO» elige una categoría al guardar, y lo que salió se conserva: el mismo número no cambia de rankings entre compilaciones. Los tres deben ser distintos, porque aparecen juntos en una sola pantalla.'
  news-maker-duplicate-ranking: Los tres rankings deben ser distintos entre sí.
  news-maker-no-categories: No hay suficientes categorías de ranking para llenar los tres huecos.
  news-maker-unknown-ranking: Esa no es una categoría de ranking que estas herramientas conozcan.
  news-maker-too-long: 'Demasiado largo para la pantalla:'
  news-maker-region-empty: 'No se puede compilar una región cuyo idioma no tiene texto: no saldría en blanco, saldría con el artículo de 2002 de la plantilla:'
  news-maker-region-needs: Escribe primero el titular y el artículo en %lang%.
  news-maker-ranking: Ranking %n%
  news-maker-text: Textos
  news-maker-text-hint: Tres textos distintos, cada uno aparece en otro sitio. Si dejas un idioma vacío, ese idioma conserva lo que tenía la plantilla.
  news-maker-text-none: "Marca un idioma en «Compilar para» arriba y sus campos aparecen aquí."
