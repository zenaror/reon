  reon-username-mail-note: "この名前はゲームが使うREONのメールアドレスにもなります："
  reon-username-mail-internal: "ゲームボーイから"
  reon-username-mail-external: "インターネットから"
  reon-username-taken: "その名前は既に使われています。別の名前を選んでください。"
  reon-username-free: "その名前は使えます。"
  reon-username-mail-or: "または"
  reon-username-mail-truncated: "ゲームボーイ側は8文字までのため、ゲーム内のアドレスはユーザー名を短くしたものです。どちらも同じ受信箱に届きます。"
  region-explanation-para1: REONは、ゲーム内のトレードコーナー機能を通じて、ポケモンクリスタルのプレイヤー同士の国際交換を可能にします。これには、通常は文字セットが異なるため互換性のない日本版と海外版の間の交換も含まれます。このような交換を可能にするため、本サービスは日本版と海外版のポケモンをマッチングする際に、ポケモンのニックネーム、トレーナー名、メールに書かれたメッセージを変更します(例:「A」を「ア」に変更、およびその逆)。これらの変更は元に戻せませんが、元の言語の表記をできるだけ忠実に再現することを目指しています。
  region-explanation-para2: 交換してもよい地域のプールを選んでください。この設定は登録後にも変更できます。

