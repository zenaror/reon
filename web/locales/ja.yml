  title: "あなたのREONパスポート"
  download-hint: "クリックしてダウンロード"
  intro: "このファイルはREONのサービスを利用するためのパスポートです。"
  body-1: "mGBAでのエミュレーションで接続する場合でも、実機のハードウェアを使う場合でも、この小さな設定ファイルにはゲームがREONを見つけて接続するために必要な情報が含まれています。"
  body-2: "ゲームとREONネットワークをつなぐリンクだと考えてください。config.binを正しい場所にインストールすれば、対応するゲームやソフトウェアがそれを使ってREONのサーバーに接続し、オンライン機能を利用できるようになります。"
  mgba-heading: "mGBAでプレイしますか?"
  mgba-body: "始めるのは簡単です! config.binをダウンロードしたら、mGBAセットアップガイドをご覧ください。手順を一つずつご案内します。"
  hardware-heading: "実機ハードウェアでプレイしますか?"
  hardware-body: "実機からもREONに接続できます! 実機ハードウェアセットアップガイドで、必要なものと接続方法を確認してください。"
  keep-heading: "パスポートをなくさないように!"
  keep-body: "config.binのコピーを安全な場所に保管してください。別の端末でREONを設定したり、エミュレーターを再インストールしたりする際に、再び必要になることがあります。"
  redownload-note: "なくしてしまった場合は、%link_open%マイアカウント%link_close%ページから新しいコピーをダウンロードできます。"
