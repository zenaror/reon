homepage:
  eyebrow: モバイルシステムGB
  tagline: "ゲームボーイカラーを世界とつなごう。モバイルアダプタを使って、世界中のプレイヤーと交換したり、対戦したり、ランキングを競い合おう。"
  learn-more: くわしく見る
  what-is-reon: REONとは？
  intro-1: "REONは「モバイルシステムGB」を再現したものです。ゲームボーイカラーをネットワークにつなぎ、広い世界へと接続するオンラインサービス。もし任天堂の「モバイルシステムGB」が世界中で発売されていたら、どうなっていたか。交換も、対戦も、ダウンロードも、手のひらの中でひとつに。"
  intro-2: "そのカギとなるのが「モバイルアダプタ」です。この小さな周辺機器を、ゲームボーイカラーやゲームボーイアドバンスのEXT端子（外部拡張端子）につなぎ、携帯電話と接続します。これで、電波の届く場所ならどこからでも本体からアクセスして、REONのサービスを利用できます。"
  games-services: ゲームとサービス
  crystal-desc: "全国ランキングを駆け上がり、トレードコーナーでトレーナーと出会い、バトルタワーの殿堂を目指そう。すべて『ポケットモンスター クリスタル』から。"
  gbwars-desc: "マップギャラリーを見て、新しい戦場をダウンロードし、軍を指揮しよう。"
  mariokart-desc: "自己ベストのラップタイムを登録して、世界中のゴーストと「スーパーサーキット」のランキングで競い合おう。"
  enter: ひらく
  top: トップへ

