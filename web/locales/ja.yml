  trainer-img-empty-image: 画像にピクセルがありません。
  trainer-img-not-8-bit: 幅と高さは、それぞれ 8 ビットに収まらなければなりません（最大 %n%）。
  trainer-img-offset-too-far: ピクセルデータの位置がファイルの奥すぎて、指し示せません。
  trainer-img-too-large: この形式で許される大きさを超えています。
  trainer-img-too-big: ファイルが大きすぎます。
  trainer-img-not-writable: 画像のディレクトリに書き込めません。
  trainer-img-mkdir-failed: 画像のディレクトリを作成できませんでした。
  trainer-img-write-failed: ファイルを書き込めませんでした。
  trainer-img-replace-failed: ファイルを所定の場所に置けませんでした。
  trainer-img-no-such-page: そのページはありません。
  trainer-readonly: ウェブサーバーがこれらのファイルに書き込めないため、ここではまだ何も保存できません。
  trainer-readonly-why: PHP は「%user%」として動いており、ページはそれを配置したアカウントのものです。そのユーザーに書き込み権限を与えるのは、コマンド1つです：

