  news-maker-title: Pokémon News
  news-maker-intro: Un numero della rivista è un piccolo programma che il gioco esegue, costruito con gli strumenti veri. Tu scegli le parole, le classifiche e il minigioco; tutto il resto viene da un numero che si sa funzionare.
