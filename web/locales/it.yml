  trade-option-2: Tutte le regioni con lingue compatibili
  trade-option-3: Tutte le regioni, inclusa la conversione latino-giapponese
  time-zone: Fuso orario
  time-zone-blurb: Scegli il fuso orario in cui vengono mostrate le date e gli orari sul sito. Lascia il valore predefinito per vedere tutto nel fuso orario originale del gioco (Giappone, +0900).
  update-settings: Aggiorna impostazioni
  adapter-settings: "Adattatore"
  adapter-color: "Colore dell'adattatore"
  adapter-blurb: "Quale adattatore vedono i giochi leggendo il tuo mobile_config.bin. Cambia il colore e il nome mostrati dal gioco, nient'altro."
  adapter-unmetered: "Senza tariffa (nessun addebito al minuto)"
  adapter-unmetered-explanation: "Dice al gioco che la chiamata non è tariffata al minuto. In Pokémon Cristallo giapponese questo toglie il limite di tempo alle lotte via cellulare. Cosa faccia negli altri giochi non si sa — nessuno l'ha documentato — quindi se un gioco si comporta in modo strano con questa opzione attiva, disattivarla è la prima cosa da provare."
  rankings-opt-in: "Classifiche"
  rankings-opt-in-blurb: "Se ciò che il tuo gioco invia può essere mostrato ad altre persone — nelle pagine di classifica e nella tabella che i giochi visualizzano. L'invio in sé non cambia: la cartuccia manda quel che manda, e il server lo conserva comunque."
  rankings-opt-in-on: "Mostrami nelle classifiche"
  rankings-opt-in-off: "Tienimi fuori dalle classifiche"
  rankings-opt-in-note: "Viene mostrato il nome inviato dal tuo gioco, la tua regione o provincia, e il messaggio che il gioco ti ha fatto comporre dalla sua lista di parole. Disattivare nasconde anche ciò che c'è già; riattivare lo riporta."
  birth-date: "Data di nascita"
  birth-date-blurb: "Serve a una cosa sola: decidere se i tuoi risultati possono comparire nelle classifiche. Non viene mai mostrata a nessuno, e non è quello che manda il gioco — il gioco ha un suo campo età, che scrivi lì dentro. Puoi impostarla una volta; dopo non si può più modificare."
  birth-date-locked: "Già salvata — non può essere modificata. Eliminare l'account la rimuove."
  birth-date-optional: "Facoltativa — la registrazione si completa anche senza."
  birth-date-invalid: "Questa data non va bene. Controlla l'anno."
  rankings-blocked-age: "Le classifiche sono chiuse per questo account: la data di nascita indica meno di %age% anni. Una voce in classifica mostra a tutti gli altri giocatori la tua età, il tuo genere, la tua regione e il tuo nome — per questo qui non è una scelta."
  rankings-reminder: "Sei fuori dalle classifiche. Ciò che il tuo gioco invia viene conservato, ma non mostrato a nessuno — puoi cambiarlo nella"
  rankings-reminder-link: "pagina del tuo account"
  download-my-data: "Scarica i miei dati"
  data-rights-note: "Il download è tutto ciò che il server conserva su questo account, in un unico file JSON, posta compresa. Le chiavi dei dispositivi e il token del relay sono nominati ma non trascritti: sono credenziali in uso, e una loro copia in un file che ti porti dietro è una copia che prima non esisteva."
  delete-account: "Elimina account"
  delete-intro: "Questo rimuove l'account e tutto ciò che vi è collegato. Non si può annullare, e non c'è periodo di ripensamento."
  delete-item-mail: "Tutta la posta, nella casella e nel cestino, letta o no."
  delete-item-devices: "Ogni dispositivo collegato, con codice di associazione, contatore e chiave."
  delete-item-games: "Ciò che i giochi hanno registrato: classifiche, risultati della Torre Lotta, depositi e scambi del Trade Corner."
  delete-item-identity: "L'account stesso, l'indirizzo di gioco e l'identificativo di accesso. L'indirizzo potrà poi essere preso da qualcun altro."
  delete-warning: "La posta già consegnata a un'altra persona è sua e resta con lei — eliminare questo account non entra nella casella di nessuno."
  delete-export-first: "Se vuoi una copia di tutto questo, prendila prima di eliminare:"
  delete-type-name: "Digita %name% per confermare"
  delete-name-mismatch: "Questo non è il nome dell'account, esattamente come scritto sopra."
  delete-confirm: "Elimina definitivamente questo account"
  delete-cancel: "Annulla"
  delete-failed: "Non è stato eliminato nulla — qualcosa è andato storto sul server. L'account è intatto; riprova, e avvisa un amministratore se continua a fallire."
  adapter-color-8: "Blu"
  adapter-color-9: "Giallo"
  adapter-color-11: "Rosso"
  adapter-following-default: "Non hai ancora scelto, quindi valgono le impostazioni del sito."
  adapter-download-note: "La modifica vale per il prossimo mobile_config.bin scaricato. Un file già in uso continua a funzionare."
  adapter-invalid: "Questo non è un adattatore noto al server. Non è stato modificato nulla."
