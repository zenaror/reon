  reon-username: "Nome utente REON"
  reon-username-hint: "Da 3 a 20 caratteri, solo lettere minuscole e numeri."
  reon-username-invalid: "Nome utente non valido o già in uso"
  reon-username-mail-note: "Questo nome diventa anche il tuo indirizzo e-mail REON, usato dai giochi:"
  reon-username-mail-internal: "Dal Game Boy"
  reon-username-mail-external: "Da internet"
  reon-username-taken: "Questo nome è già in uso — scegline un altro."
  reon-username-free: "Questo nome è disponibile."
  reon-username-mail-or: "o"
  reon-username-mail-truncated: "Il Game Boy accetta solo 8 caratteri, quindi l'indirizzo nel gioco è il tuo nome utente accorciato: entrambi arrivano nella stessa casella."
  region-explanation-para1: REON consente lo scambio internazionale per i giocatori di Pokémon Cristallo, tramite la funzione di gioco chiamata Trade Corner. Questo include scambi tra giochi giapponesi e non giapponesi, normalmente incompatibili perché usano set di caratteri diversi. Per rendere possibili questi scambi, il servizio modifica i soprannomi dei Pokémon, i nomi degli Allenatori e i messaggi scritti sulla Posta durante l'abbinamento di Pokémon tra giochi giapponesi e non giapponesi (ad esempio, cambiando "A" in "ア", e viceversa). Queste modifiche sono irreversibili, ma cercano di imitare la scrittura della lingua originale nel modo più fedele possibile.
  region-explanation-para2: Scegli l'insieme di regioni con cui accetti di scambiare. Questa impostazione può essere modificata anche dopo la registrazione.

