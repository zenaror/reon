  news-maker-minigame: Minigioco
  news-maker-minigame-broken: "Questo minigioco non compila con la toolchain attuale: c'è un errore nel suo stesso sorgente, a monte. Non c'è nessun premio da scegliere e il numero non può essere pubblicato con esso. Scegline un altro."
  news-maker-publish-now-unbuilt: Questo numero non è ancora stato compilato. Aprilo, seleziona le lingue e premi prima Pubblica.
  news-maker-published-now: In onda ora in %regions%.
  news-maker-prizes: Premi
  news-maker-prizes-hint: "Ciò che il minigioco consegna a chi vince. L'elenco è letto dal codice del minigioco stesso, quindi cambiare minigioco cambia l'elenco. Viene offerta tutta la tabella degli oggetti, oggetti chiave compresi: la cartuccia li conosce, ma il gioco non si aspetta di riceverne uno dalle notizie."
  news-maker-prize: Premio %n%
  news-maker-prize-default: "com'è: %item%"
  news-maker-prize-fixed: Lo sceglie il minigioco.
  news-maker-prize-none: Questo minigioco non consegna premi.
  news-maker-bad-prize: "Questo oggetto non esiste:"
  news-maker-headline-hint: Il nome del numero sulla schermata delle notizie — sullo striscione mentre la console lo scarica, e come titolo in cima alla pagina. Al massimo %n% caratteri, quanti ne usa il numero vero più largo.
  news-maker-body-hint: 'Il testo dietro «Guida alle notizie»: l''articolo che legge il giocatore. Una riga vuota comincia un paragrafo; la prima riga apre il riquadro, la seconda sta sotto, il resto scorre. **%n% caratteri per riga**, perché il riquadro è largo %n% caselle. Nessun limite al numero di righe: il testo scorre.'
