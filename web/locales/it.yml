  month-7: luglio
  month-8: agosto
  month-9: settembre
  month-10: ottobre
  month-11: novembre
  month-12: dicembre
  news-maker-date: Esce il
  news-maker-date-hint: Il giorno in cui questo numero prende il posto degli altri, e continua a uscire finché non arriva il giorno di un altro. Scegli il mese e il giorno; l'anno è quello corrente, così un giorno che non è ancora arrivato aspetta invece di uscire subito. Febbraio si ferma al 28, perché un 29 esisterebbe solo in un anno bisestile.
  news-maker-withdraw: Ritira
  news-maker-withdrawn: Ritirato. Il gioco non lo userà più.
  news-maker-withdraw-confirm: Togliere questo numero dal calendario ed eliminare ciò che è stato compilato? Smette di uscire, ma la riga delle notizie conserva il suo contenuto fino al prossimo cambio delle notizie ordinarie per quella regione, perché è allora che il programmatore la ricopia.
