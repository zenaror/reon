  login-to-reon: Accedi al tuo account REON
  invalid-email-pass: E-mail o password errati
  signup-to-reon: Registrati su REON
  i-agree-terms: Accetto i termini di utilizzo e l'informativa sulla privacy
  you-must-agree: Devi accettare
  registration-email-sent: Se non sei ancora registrato, un'e-mail contenente un link per continuare la registrazione è stata inviata all'indirizzo specificato.
  registration-complete: La tua registrazione è completa.
  reon-username: "Nome utente REON"
  reon-username-hint: "Da 3 a 20 caratteri, solo lettere minuscole e numeri."
  reon-username-invalid: "Nome utente non valido o già in uso"
  reon-username-mail-note: "Questo nome diventa anche il tuo indirizzo e-mail REON, usato dai giochi:"
  reon-username-mail-internal: "Dal Game Boy"
  reon-username-mail-external: "Da internet"
  reon-username-taken: "Questo nome è già in uso — scegline un altro."
  reon-username-free: "Questo nome è disponibile."
  reon-username-mail-or: "o"
  reon-username-mail-truncated: "Il Game Boy accetta solo 8 caratteri, quindi l'indirizzo nel gioco è il tuo nome utente accorciato: entrambi arrivano nella stessa casella."
  region-explanation-para1: REON consente lo scambio internazionale per i giocatori di Pokémon Cristallo, tramite la funzione di gioco chiamata Trade Corner. Questo include scambi tra giochi giapponesi e non giapponesi, normalmente incompatibili perché usano set di caratteri diversi. Per rendere possibili questi scambi, il servizio modifica i soprannomi dei Pokémon, i nomi degli Allenatori e i messaggi scritti sulla Posta durante l'abbinamento di Pokémon tra giochi giapponesi e non giapponesi (ad esempio, cambiando "A" in "ア", e viceversa). Queste modifiche sono irreversibili, ma cercano di imitare la scrittura della lingua originale nel modo più fedele possibile.
  region-explanation-para2: Scegli l'insieme di regioni con cui accetti di scambiare. Questa impostazione può essere modificata anche dopo la registrazione.
  rankings-explanation-para1: "Quando giochi a Pokémon Cristallo con l'adattatore, il gioco ci manda il tuo punteggio insieme al nome, all'età e alla regione che hai scritto nel gioco, più un breve messaggio composto con l'elenco di parole del gioco stesso. Questa parte non è facoltativa: al gioco serve per funzionare, e noi la conserviamo comunque."
  rankings-explanation-para2: "Questa casella riguarda gli altri giocatori. Spuntata, il tuo nome, la tua regione e il tuo messaggio compaiono nelle classifiche — quelle di questo sito e quelle che mostra il gioco stesso. Lasciata vuota, il tuo punteggio vale ancora per te, ma nessun altro vede chi sei."
  rankings-explanation-para3: "Puoi cambiare idea quando vuoi, dalla pagina del tuo account, e vale in entrambi i sensi: disattivarla nasconde anche quello che c'è già, riattivarla lo riporta. Un'eccezione: se l'età impostata nel gioco è sotto i 13 anni, resti fuori dalle classifiche a prescindere da questa casella."
  rankings-opt-in-check: "Sì, mostratemi nelle classifiche"
  rankings-opt-in-optional: "Facoltativo — la registrazione si completa in ogni caso."
  birth-date-explanation-para1: "La chiediamo per sapere se hai l'età per comparire nelle classifiche pubbliche. Comparire lì mostra a tutti gli altri giocatori, in una volta, la tua età, il tuo genere, la tua regione e il tuo nome — il gioco li stampa su una riga — quindi non è una cosa da attivare per un bambino."
  birth-date-explanation-para2: "Non viene mai mostrata a nessuno, e nient'altro nel sito la usa. Puoi lasciarla vuota e completare comunque la registrazione: le classifiche restano solo chiuse finché non la compili, cosa che puoi fare dopo dalla pagina del tuo account. E non è la stessa cosa dell'età che scrivi nel gioco: quella la manda la cartuccia da sola, e nessuno la controlla."

