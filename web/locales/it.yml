  news-maker-not-built: non compilato
  news-maker-name: Nome
  news-maker-name-hint: Per te e per il nome del file. Non viene mostrato nel gioco.
  news-maker-message: Riga della casella postale
  news-maker-message-hint: 'L''unica riga che la casella postale del gioco mostra per questo numero prima che qualcuno lo apra. Se la lasci vuota, viene usato il titolo di questa lingua. Al massimo %n% caratteri, e scritta con i caratteri propri del gioco: ciò che non sa disegnare viene rifiutato indicando quale è.'
  news-maker-schedule-locked: I numeri si possono compilare, ma non ancora programmare.
  news-maker-schedule-why: 'Il calendario dei numeri fatti in casa è un file a parte, e il server web non può scriverlo. Di proposito non è la configurazione accanto: quella contiene anche il calendario delle notizie ordinarie, che questo pannello non ha motivo di cambiare:'
  news-maker-built-only: compilato, ma fuori dal calendario — nessun giocatore lo vede
