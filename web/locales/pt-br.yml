  download-my-data: "Baixar meus dados"
  data-rights-note: "O download é tudo o que o servidor guarda sobre esta conta, num arquivo JSON só, incluindo o seu correio. Chaves de aparelho e o token de relay são citados, mas não escritos: são credenciais em uso, e uma cópia delas num arquivo que você leva para qualquer lugar é uma cópia que não existia antes."
