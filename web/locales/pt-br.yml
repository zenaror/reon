  trade-corner-region-allowlist: "Trade Corner: Preferências de Troca"
  trade-region-allowlist-blurb: Selecione o conjunto de regiões com as quais você aceita trocar ao depositar seu Pokémon no Trade Corner. Qualquer troca que você receber será de dentro desse conjunto. "Regiões com idiomas compatíveis" se refere a jogos com conjuntos de caracteres compatíveis, ou seja, todos os idiomas latinos ou o japonês sozinho.
