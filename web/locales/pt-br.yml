  registration-email-sent: Se ainda não estiver registrado, um e-mail contendo um link para continuar seu cadastro foi enviado para o endereço especificado.
  registration-complete: Seu cadastro foi concluído.
  reon-email: Endereço de e-mail REON
  reon-email-invalid: E-mail REON inválido ou já em uso
  region-explanation-para1: O REON permite trocas internacionais para jogadores de Pokémon Crystal, através do recurso do jogo chamado Trade Corner. Isso inclui trocas entre jogos japoneses e não-japoneses, que normalmente são incompatíveis por usarem conjuntos de caracteres diferentes. Para tornar essas trocas possíveis, o serviço altera apelidos de Pokémon, nomes de Treinador e mensagens escritas no Correio ao parear Pokémon entre jogos japoneses e não-japoneses (por exemplo, trocando "A" por "ア", e vice-versa). Essas alterações são irreversíveis, mas procuram imitar a escrita do idioma original da forma mais fiel possível.
  region-explanation-para2: Escolha o conjunto de regiões com as quais você aceita trocar. Essa configuração também pode ser alterada depois do cadastro.

