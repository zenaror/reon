  adapter-settings: "Adaptador"
  adapter-color: "Cor do adaptador"
  adapter-blurb: "Qual adaptador os jogos enxergam ao ler a sua mobile_config.bin. Muda a cor e o nome que o jogo mostra — nada mais no funcionamento."
  adapter-unmetered: "Não tarifado (sem cobrança por minuto)"
  adapter-unmetered-explanation: "Avisa ao jogo que a ligação não é cobrada por minuto. No Pokémon Crystal japonês isso tira o limite de tempo das batalhas por celular. O que acontece nos outros jogos não se sabe — ninguém documentou — então, se algum jogo se comportar de forma estranha com isto ligado, desligar é a primeira coisa a tentar."
  rankings-opt-in: "Rankings"
  rankings-opt-in-blurb: "Se o que o seu jogo envia pode ser mostrado a outras pessoas — nas páginas de ranking e na tabela de ranking que os jogos exibem. O envio em si não muda: o cartucho manda o que manda, e o servidor guarda de qualquer forma."
  rankings-opt-in-on: "Mostrar nos rankings"
  rankings-opt-in-off: "Ficar fora dos rankings"
  rankings-opt-in-note: "O que aparece é o nome que o seu jogo enviou, o seu estado ou província, e a mensagem que o jogo deixou você montar a partir da lista de palavras dele. Desligar também esconde o que já está lá; religar traz de volta."
  birth-date: "Data de nascimento"
  birth-date-blurb: "Serve para uma coisa só: decidir se os seus resultados podem aparecer nos rankings. Nunca é mostrada a ninguém, e não é o que o jogo manda — o jogo tem um campo de idade próprio, que você digita dentro dele. Você define uma vez; depois disso ela não pode ser alterada."
