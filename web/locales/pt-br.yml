homepage:
  eyebrow: O Sistema Mobile GB
  tagline: "Conecte seu Game Boy Color ao mundo. Troque, batalhe e suba no ranking com jogadores de todo lugar, tudo através do Mobile Adapter."
  learn-more: Saiba mais
  what-is-reon: "O que é o REON?"
  intro-1: "O REON é uma recriação do Mobile GB System: um serviço online completo para o Game Boy Color que conecta seu portátil à rede e ao resto do mundo. Ele reimagina o que poderia ter sido um lançamento mundial do Mobile System GB da Nintendo, um só lugar para trocar, competir e baixar conteúdo, tudo na palma da sua mão."
  intro-2: "A peça-chave de tudo isso é o Mobile Adapter. Esse pequeno acessório se conecta à porta EXT do seu Game Boy Color ou Game Boy Advance e o liga a um telefone celular, para que seu portátil possa discar e alcançar os serviços do REON de qualquer lugar com sinal."
  games-services: "Jogos e Serviços"
  crystal-desc: "Suba no ranking nacional, encontre treinadores no Trade Corner e busque um lugar no quadro de honra da Battle Tower, tudo direto da Versão Crystal."
  gbwars-desc: "Explore a galeria de mapas e baixe novos campos de batalha para posicionar seu exército e assumir o comando."
  mariokart-desc: "Poste suas voltas mais rápidas e corra contra dados fantasma de jogadores do mundo todo nos rankings do Super Circuit."
  enter: Entrar
  top: Topo

