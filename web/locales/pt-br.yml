  reon-username: "Usuário REON"
  reon-username-hint: "De 3 a 20 caracteres, apenas letras minúsculas e números."
  reon-username-invalid: "Usuário inválido ou já em uso"
  reon-username-mail-note: "Esse nome também vira seu endereço de e-mail no REON, usado pelos jogos:"
  reon-username-mail-internal: "Pelo Game Boy"
  reon-username-mail-external: "Pela internet"
  reon-username-taken: "Esse nome já está em uso — escolha outro."
  reon-username-free: "Esse nome está disponível."
  reon-username-mail-or: "ou"
  reon-username-mail-truncated: "O Game Boy só comporta 8 caracteres, então o endereço no jogo é o seu nome de usuário encurtado — os dois chegam na mesma caixa."
  region-explanation-para1: O REON permite trocas internacionais para jogadores de Pokémon Crystal, através do recurso do jogo chamado Trade Corner. Isso inclui trocas entre jogos japoneses e não-japoneses, que normalmente são incompatíveis por usarem conjuntos de caracteres diferentes. Para tornar essas trocas possíveis, o serviço altera apelidos de Pokémon, nomes de Treinador e mensagens escritas no Correio ao parear Pokémon entre jogos japoneses e não-japoneses (por exemplo, trocando "A" por "ア", e vice-versa). Essas alterações são irreversíveis, mas procuram imitar a escrita do idioma original da forma mais fiel possível.
  region-explanation-para2: Escolha o conjunto de regiões com as quais você aceita trocar. Essa configuração também pode ser alterada depois do cadastro.
  rankings-explanation-para1: "Quando você joga Pokémon Crystal pelo adaptador, o jogo manda para nós a sua pontuação junto com o nome, a idade e o estado que você digitou no jogo, mais uma frase curta que você montou com as palavras que o próprio jogo oferece. Essa parte não é opcional: o jogo precisa dela para funcionar, e nós guardamos de qualquer jeito."
  rankings-explanation-para2: "Esta caixa é sobre os outros jogadores. Marcada, o seu nome, a sua região e a sua frase aparecem nas listas de ranking — as deste site e as que o próprio jogo mostra. Vazia, a sua pontuação continua valendo para você, mas ninguém mais vê quem você é."
  rankings-explanation-para3: "Você pode mudar de ideia quando quiser, na página da sua conta, e vale nos dois sentidos: desligar esconde o que já está lá, ligar traz de volta. Uma exceção: se a idade configurada no seu jogo for menor que 13, você fica fora dos rankings independentemente desta caixa."
  rankings-opt-in-check: "Sim, quero aparecer nos rankings"
  rankings-opt-in-optional: "Opcional — o cadastro fecha do mesmo jeito."
  birth-date-explanation-para1: "Pedimos para saber se você tem idade para aparecer nos rankings públicos. Aparecer lá mostra a sua idade, o seu gênero, a sua região e o seu nome de uma vez para todos os outros jogadores — o jogo imprime tudo numa linha — então não é coisa para ligar para uma criança."
  birth-date-explanation-para2: "Ela nunca é mostrada a ninguém, e nada mais no site usa. Você pode deixar vazio e fechar o cadastro do mesmo jeito: os rankings só ficam fechados até você preencher, o que dá para fazer depois na página da sua conta. E ela não é a mesma coisa que a idade que você digita dentro do jogo — aquela o cartucho manda sozinho, e ninguém confere."

