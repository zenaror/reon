  birth-date-invalid: "Essa data não serve. Confira o ano."
  rankings-blocked-age: "Os rankings estão fechados para esta conta: a data de nascimento dela indica menos de %age% anos. Uma entrada no ranking mostra a sua idade, o seu gênero, o seu estado e o seu nome para todos os outros jogadores — por isso esta não é uma escolha."
  rankings-reminder: "Você está fora dos rankings. O que o seu jogo envia é guardado, mas não é mostrado a ninguém — dá para mudar isso na"
