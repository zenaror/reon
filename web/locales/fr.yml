  update-settings: Mettre à jour les paramètres
  pokemon-news-custom-opt-in: 'Pokémon Infos : Préférences d’actualités'
  pokemon-news-custom-opt-in-blurb: Lorsqu’elle est activée, les téléchargements de Pokémon Infos peuvent utiliser,
    lorsqu’ils sont disponibles, des contenus d’actualités personnalisés créés par
    l’équipe REON. S’il n’existe aucune actualité personnalisée, les actualités
    officielles seront utilisées à la place.
  pokemon-news-custom-opt-in-off: Actualités Pokémon officielles uniquement
  pokemon-news-custom-opt-in-on: Actualités Pokémon personnalisées lorsqu’elles sont disponibles
  mobile-stadium-custom-opt-in: 'Mobile Stadium : Préférences de contenu'
  mobile-stadium-custom-opt-in-blurb: Lorsqu’elle est activée, Mobile Stadium peut proposer,
    lorsque disponibles, des données de combat personnalisées reconstituées par
    l’équipe REON. Il s’agit de contenu créé par des fans, pas de données
    officielles Nintendo.
  mobile-stadium-custom-opt-in-off: Contenu Mobile Stadium officiel uniquement
  mobile-stadium-custom-opt-in-on: Contenu Mobile Stadium personnalisé lorsque disponible
  gbwars-custom-opt-in: "Game Boy Wars 3 : Préférences de cartes"
  gbwars-custom-opt-in-blurb: "Lorsqu’elle est activée, le menu des cartes de Game Boy Wars 3 propose aussi des cartes personnalisées créées par l’équipe REON. Il s’agit de contenu réalisé par des fans, pas de données officielles. Les cartes officielles sont toujours proposées."
  gbwars-custom-opt-in-off: "Cartes officielles uniquement"
  gbwars-custom-opt-in-on: "Cartes officielles et personnalisées"
  adapter-settings: "Adaptateur"
  adapter-color: "Couleur de l'adaptateur"
  adapter-blurb: "Quel adaptateur les jeux voient en lisant votre mobile_config.bin. Cela change la couleur et le nom affichés par le jeu, rien d'autre."
  adapter-unmetered: "Hors forfait (pas de facturation à la minute)"
  adapter-unmetered-explanation: "Indique au jeu que l'appel n'est pas facturé à la minute. Dans Pokémon Cristal japonais, cela supprime la limite de temps des combats par mobile. Ce que cela fait dans les autres jeux n'est pas connu — personne ne l'a documenté — donc si un jeu se comporte bizarrement avec cette option activée, la désactiver est la première chose à essayer."
  rankings-opt-in: "Classements"
  rankings-opt-in-blurb: "Si ce que votre jeu envoie peut être montré à d'autres — sur les pages de classement et dans le tableau que les jeux affichent. L'envoi lui-même ne change pas : la cartouche envoie ce qu'elle envoie, et le serveur le conserve dans les deux cas."
  rankings-opt-in-on: "M'afficher dans les classements"
  rankings-opt-in-off: "Me laisser hors des classements"
  rankings-opt-in-note: "Ce qui s'affiche est le nom envoyé par votre jeu, votre état ou province, et le message que le jeu vous a laissé composer à partir de sa propre liste de mots. Désactiver masque aussi ce qui est déjà là ; réactiver le fait revenir."
  birth-date: "Date de naissance"
  birth-date-blurb: "Elle sert à une seule chose : décider si tes résultats peuvent apparaître dans les classements. Elle n'est jamais montrée à personne, et ce n'est pas ce que le jeu envoie — le jeu a son propre champ d'âge, que tu saisis dedans. Tu peux la définir une fois ; ensuite elle ne peut plus être modifiée."
  birth-date-locked: "Déjà enregistrée — elle ne peut pas être modifiée. Supprimer le compte la supprime."
  birth-date-optional: "Facultatif — l'inscription se termine sans elle."
  birth-date-invalid: "Cette date ne convient pas. Vérifie l'année."
  rankings-blocked-age: "Les classements sont fermés pour ce compte : la date de naissance indique moins de %age% ans. Une entrée de classement montre ton âge, ton genre, ta région et ton nom à tous les autres joueurs — c'est pourquoi ce n'est pas un choix ici."
  rankings-reminder: "Vous n'êtes pas dans les classements. Ce que votre jeu envoie est conservé, mais montré à personne — vous pouvez changer cela sur"
  rankings-reminder-link: "la page de votre compte"
  download-my-data: "Télécharger mes données"
  data-rights-note: "Le téléchargement contient tout ce que le serveur conserve sur ce compte, dans un seul fichier JSON, courrier compris. Les clés d'appareil et le jeton de relais sont mentionnés mais non écrits : ce sont des identifiants en service, et une copie dans un fichier que vous emportez est une copie qui n'existait pas avant."
  delete-account: "Supprimer le compte"
  delete-intro: "Ceci supprime le compte et tout ce qui y est rattaché. Sans retour possible, et sans délai de rétractation."
  delete-item-mail: "Tout le courrier, dans la boîte de réception et dans la corbeille, lu ou non."
  delete-item-devices: "Chaque appareil connecté, avec son code d'appairage, son compteur et sa clé."
  delete-item-games: "Ce que les jeux ont enregistré : classements, résultats de la Tour de Combat, dépôts et échanges du Trade Corner."
  delete-item-identity: "Le compte lui-même, l'adresse de jeu et l'identifiant de connexion. L'adresse pourra ensuite être prise par quelqu'un d'autre."
  delete-warning: "Le courrier déjà remis à quelqu'un d'autre lui appartient et reste chez lui — supprimer ce compte n'atteint la boîte de personne."
  delete-export-first: "Si vous voulez une copie de tout cela, prenez-la avant de supprimer :"
  delete-type-name: "Saisissez %name% pour confirmer"
  delete-name-mismatch: "Ce n'est pas le nom du compte, exactement tel qu'il est écrit ci-dessus."
  delete-confirm: "Supprimer ce compte définitivement"
  delete-cancel: "Annuler"
  delete-failed: "Rien n'a été supprimé — une erreur est survenue sur le serveur. Le compte est intact ; réessayez, et prévenez un administrateur si cela persiste."
