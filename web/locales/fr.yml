  news-maker-title: Pokémon News
  news-maker-intro: Un numéro du magazine est un petit programme que le jeu exécute, assemblé avec la vraie chaîne d'outils. Vous choisissez les mots, les classements et le mini-jeu ; tout le reste vient d'un numéro dont on sait qu'il fonctionne.
  news-maker-unavailable: 'Compilation impossible pour l''instant — il manque :'
  news-maker-new: Nouveau numéro
  news-maker-back: Retour aux numéros
  news-maker-none: Aucun numéro n'a encore été créé.
  news-maker-issue: Numéro
  news-maker-rankings: Classements
  news-maker-built: Compilé pour
  news-maker-not-built: non compilé
  news-maker-name: Nom
  news-maker-name-hint: Pour vous, et pour le nom du fichier. Pas affiché dans le jeu.
  news-maker-message: Ligne de la boîte aux lettres
  news-maker-message-hint: 'L''unique ligne que la boîte aux lettres du jeu affiche pour ce numéro avant que quelqu''un ne l''ouvre. Laissée vide, le titre de cette langue est utilisé. Au plus %n% caractères, et écrite avec les caractères propres au jeu : ce qu''il ne sait pas dessiner est refusé en le nommant.'
  news-maker-schedule-locked: Les numéros peuvent être compilés, mais pas encore programmés.
  news-maker-schedule-why: 'Le calendrier des numéros maison est un fichier à part, et le serveur web ne peut pas l''écrire. Ce n''est volontairement pas la configuration d''à côté : celle-là porte aussi le calendrier des actualités ordinaires, que ce panneau n''a aucune raison de modifier :'
  news-maker-built-only: compilé, mais absent du calendrier — aucun joueur ne le voit
  month-1: janvier
  month-2: février
  month-3: mars
  month-4: avril
  month-5: mai
  month-6: juin
  month-7: juillet
  month-8: août
  month-9: septembre
  month-10: octobre
  month-11: novembre
  month-12: décembre
  news-maker-date: Paraît le
  news-maker-date-hint: Le jour où ce numéro prend le relais, et il continue de paraître jusqu'à ce que vienne le jour d'un autre. Vous choisissez le mois et le jour ; l'année est l'année en cours, donc un jour encore à venir attend au lieu de paraître tout de suite. Février s'arrête au 28, parce qu'un 29 n'existerait qu'en année bissextile.
  news-maker-withdraw: Retirer
  news-maker-withdrawn: Retiré. Le jeu ne l'utilisera plus.
  news-maker-withdraw-confirm: Sortir ce numéro du calendrier et supprimer ce qui a été compilé ? Il cesse de paraître, mais la ligne d'actualité garde son contenu jusqu'à la prochaine rotation des actualités ordinaires pour cette région, car c'est à ce moment que le programmateur la recopie.
  news-maker-lang-j: japonais
  news-maker-lang-e: anglais
  news-maker-lang-d: allemand
  news-maker-lang-f: français
  news-maker-lang-i: italien
  news-maker-lang-s: espagnol
  news-maker-scheduled: Au calendrier
  news-maker-template: D'après
  news-maker-template-hint: Le vrai numéro dont celui-ci emprunte les menus, les scripts et la mise en page.
  news-maker-minigame: Mini-jeu
  news-maker-minigame-broken: "Ce mini-jeu ne se compile pas avec la chaîne d'outils actuelle : il y a une erreur dans son propre code source, en amont. Aucun prix à choisir, et un numéro ne peut pas être publié avec lui. Choisissez-en un autre."
  news-maker-publish-now-unbuilt: Ce numéro n'a pas encore été compilé. Ouvrez-le, cochez les langues et appuyez d'abord sur Publier.
  news-maker-published-now: En ligne maintenant dans %regions%.
  news-maker-prizes: Prix
  news-maker-prizes-hint: "Ce que le mini-jeu remet en cas de victoire. La liste est lue dans le code du mini-jeu lui-même : en changer change la liste. Toute la table d'objets est proposée, objets clés compris — la cartouche les connaît, mais le jeu ne s'attend pas à en recevoir un par les actualités."
  news-maker-prize: Prix %n%
  news-maker-prize-default: "tel quel : %item%"
  news-maker-prize-fixed: C'est le mini-jeu qui choisit.
  news-maker-prize-none: Ce mini-jeu ne remet aucun prix.
  news-maker-bad-prize: "Cet objet n'existe pas :"
  news-maker-headline-hint: Le nom du numéro sur l'écran d'actualités lui-même — sur la bannière pendant que la console le télécharge, et comme titre en haut de la page. Au plus %n% caractères, ce qu'utilise le vrai numéro le plus large.
  news-maker-body-hint: 'Le texte derrière « Guide des actualités » : l''article que lit le joueur. Une ligne vide commence un paragraphe ; la première ligne ouvre la boîte de dialogue, la deuxième se place en dessous, le reste défile. **%n% caractères par ligne**, parce que la boîte fait %n% cases de large. Pas de limite de lignes : le texte défile.'
  news-maker-random: CLASSEMENT ALÉATOIRE
  news-maker-ranking-hint: 'Les trois classements dont parle ce numéro. « CLASSEMENT ALÉATOIRE » tire une catégorie à l''enregistrement, et ce qui est sorti est conservé : un même numéro ne change pas de classements d''une compilation à l''autre. Les trois doivent être différents : ils se côtoient sur un seul écran.'
  news-maker-duplicate-ranking: Les trois classements doivent être différents les uns des autres.
  news-maker-no-categories: Il n'y a pas assez de catégories de classement pour remplir les trois emplacements.
  news-maker-unknown-ranking: Ce n'est pas une catégorie de classement que cette chaîne d'outils connaît.
  news-maker-too-long: 'Trop long pour l''écran :'
  news-maker-region-empty: 'Impossible de compiler une région dont la langue n''a pas de texte — elle ne sortirait pas vide, elle sortirait avec l''article de 2002 du modèle :'
  news-maker-region-needs: Écrivez d'abord le titre et l'article en %lang%.
  news-maker-ranking: Classement %n%
  news-maker-text: Textes
  news-maker-text-hint: Trois textes différents, chacun apparaissant ailleurs. Laissez une langue vide et cette langue garde ce qu'avait le modèle.
  news-maker-text-none: "Cochez une langue sous « Compiler pour » ci-dessus et ses champs apparaissent ici."
  news-maker-headline: Titre
  news-maker-body: Article
  news-maker-regions: Compiler pour
