  intro: "Chaque appareil ayant utilisé ce compte pour envoyer du courrier vers le vrai internet apparaît ici, le plus récent en premier. Donnez un nom à un appareil une fois reconnu, et bloquez celui auquel vous ne faites plus confiance."
  code-help: "Le code d'appairage est le même que celui que l'appareil affiche sur son propre écran, sa console ou sa sortie série, pour faire correspondre la ligne à l'appareil que vous avez en main."
