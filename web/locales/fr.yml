  trainer-tags-note: 'D''après la documentation de l''adaptateur, et voici la liste complète — <p>, <table> et <form> n''y sont pas. Rien n''est refusé pour être absent, car la documentation ne dit pas ce que l''adaptateur fait d''une balise qu''il ne connaît pas. Deux surprises : <b> met le texte en rouge plutôt qu''en gras, et <center> ne fonctionne qu''à l''intérieur de <html>. Les images sont uniquement des BMP 1BPP, chaque côté faisant au plus 255 pixels.'
