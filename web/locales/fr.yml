  reon-username: "Nom d'utilisateur REON"
  reon-username-hint: "De 3 à 20 caractères, uniquement lettres minuscules et chiffres."
  reon-username-invalid: "Nom d'utilisateur invalide ou déjà pris"
  reon-username-mail-note: "Ce nom devient aussi votre adresse e-mail REON, utilisée par les jeux :"
  reon-username-mail-internal: "Depuis la Game Boy"
  reon-username-mail-external: "Depuis Internet"
  reon-username-taken: "Ce nom est déjà pris — choisissez-en un autre."
  reon-username-free: "Ce nom est disponible."
  reon-username-mail-or: "ou"
  reon-username-mail-truncated: "La Game Boy ne retient que 8 caractères : l'adresse dans le jeu est donc votre nom d'utilisateur abrégé — les deux arrivent dans la même boîte."
  region-explanation-para1: REON permet l'échange international pour les joueurs de Pokémon Cristal, via la fonctionnalité en jeu appelée le Coin Troc. Cela inclut les échanges entre jeux japonais et non-japonais, normalement incompatibles à cause de jeux de caractères différents. Pour rendre ces échanges possibles, le service modifie les surnoms des Pokémon, les noms des Dresseurs, et les messages écrits sur le Courrier lors de la mise en relation entre jeux japonais et non-japonais (par exemple, en changeant « A » en « ア », et vice-versa). Ces changements sont irréversibles, mais ils visent à imiter aussi fidèlement que possible l'écriture de la langue d'origine.
  region-explanation-para2: Choisissez le pool de régions avec lesquelles vous êtes d'accord d'échanger. Ce réglage peut aussi être modifié après l'inscription.
  rankings-explanation-para1: "Quand tu joues à Pokémon Cristal avec l'adaptateur, le jeu nous envoie ton score avec le nom, l'âge et la région que tu as saisis dans le jeu, plus un court message composé à partir de la liste de mots du jeu lui-même. Cette partie n'est pas facultative : le jeu en a besoin pour fonctionner, et nous la conservons de toute façon."
  rankings-explanation-para2: "Cette case concerne les autres joueurs. Cochée, ton nom, ta région et ton message apparaissent dans les classements — ceux de ce site et ceux que le jeu affiche lui-même. Laissée vide, ton score compte toujours pour toi, mais personne d'autre ne voit qui tu es."
  rankings-explanation-para3: "Tu peux changer d'avis quand tu veux, sur la page de ton compte, et cela marche dans les deux sens : désactiver masque ce qui est déjà là, activer le fait revenir. Une exception : si l'âge défini dans ton jeu est inférieur à 13 ans, tu restes hors des classements quoi que dise cette case."
  rankings-opt-in-check: "Oui, montrez-moi dans les classements"
  rankings-opt-in-optional: "Facultatif — l'inscription se termine dans les deux cas."
  birth-date-explanation-para1: "Nous la demandons pour savoir si tu as l'âge d'apparaître dans les classements publics. Y apparaître montre ton âge, ton genre, ta région et ton nom d'un coup à tous les autres joueurs — le jeu les affiche sur une seule ligne — ce n'est donc pas quelque chose à activer pour un enfant."
  birth-date-explanation-para2: "Elle n'est jamais montrée à personne, et rien d'autre sur le site ne l'utilise. Tu peux la laisser vide et terminer ton inscription quand même : les classements restent simplement fermés jusqu'à ce que tu la remplisses, ce que tu peux faire plus tard sur la page de ton compte. Ce n'est pas non plus l'âge que tu saisis dans le jeu : celui-là, la cartouche l'envoie toute seule, et personne ne le vérifie."
