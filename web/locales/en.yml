  tournament-intro: "With this on, the relay saves what passes between the two consoles during a link session, so a match can be turned into a replay afterwards. Only the conversation between the consoles is saved — no handshake, no token, no login, nothing about the account."
  tournament-mode: "Mode"
  tournament-enable: "Save link sessions"
  tournament-note: "The relay reads this setting at the start of every session, so turning it on applies to the next match. No restart, and nothing interrupts a session already in progress."
