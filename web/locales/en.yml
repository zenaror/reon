  login-to-reon: Login to your REON account
  invalid-email-pass: Incorrect email or password
  signup-to-reon: Sign-up to REON
  i-agree-terms: I agree to the terms of use and the privacy policy
  you-must-agree: You must agree
  registration-email-sent: If not yet registered, an email containing a link to continue
    your registration was sent to the specified email address.
  registration-complete: Your registration is complete.
  reon-username: "REON username"
  reon-username-hint: "3 to 20 characters, lowercase letters and numbers only."
  reon-username-invalid: "Invalid username, or already taken"
  reon-username-mail-note: "This name also becomes your REON mail address, used by the games:"
  reon-username-mail-internal: "From the Game Boy"
  reon-username-mail-external: "From the internet"
  reon-username-taken: "That name is already taken — please choose another."
  reon-username-free: "That name is available."
  reon-username-mail-or: "or"
  reon-username-mail-truncated: "The Game Boy only holds 8 characters, so the in-game address is your username shortened — both reach the same inbox."
  region-explanation-para1: REON enables international trade for Pokémon Crystal players,
    via the in-game facility called the Trade Corner. This includes trading between
    Japanese and non-Japanese games, which are normally incompatible due to using
    different character sets. To make such trades possible, the service changes Pokémon
    nicknames, Trainer names, and messages written on Mail when matching Pokémon between
    Japanese and non-Japanese games (for example, changing "A" to "ア", and vice-versa).
    These changes are irreversible, but they aim to imitate the original language's
    lettering as faithfully as possible.
  region-explanation-para2: Choose the pool of regions you're okay with trading with.
    This setting can be changed after sign-up as well.
  rankings-explanation-para1: "When you play Pokémon Crystal through the adapter, the game sends us your score along with the name, the age and the state you typed into the game, plus a short message you put together from the game's own list of words. That part is not optional: the game needs it to work, and we keep it either way."
  rankings-explanation-para2: "This box is about the other players. Tick it and your name, your region and your message show up in the ranking lists — the ones on this site and the ones the game itself displays. Leave it empty and your score still counts for you, but nobody else sees who you are."
  rankings-explanation-para3: "You can change your mind whenever you like, on your account page, and it works in both directions: turning it off hides what is already there, turning it on brings it back. One exception: if the age set in your game is under 13, we keep you out of the rankings no matter what this box says."
  rankings-opt-in-check: "Yes, show me in the rankings"
  rankings-opt-in-optional: "Optional — you can finish signing up either way."
  birth-date-explanation-para1: "We ask for it so we know whether you are old enough to appear in the public rankings. Appearing there shows your age, your gender, your region and your name to every other player at once — the game prints them on one line — so it is not something to switch on for a child."
  birth-date-explanation-para2: "It is never shown to anyone, and nothing else on the site uses it. You can leave it empty and still finish signing up: the rankings just stay closed until you fill it in, which you can do later on your account page. It is also not the same as the age you type inside the game — that one the cartridge sends by itself, and nobody checks it."
