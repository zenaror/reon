  game-settings: "Game Settings"
  trade-corner-region-allowlist: 'Trade Corner: Trading Preferences'
  trade-region-allowlist-blurb: Select the region pool you’re willing to trade with
    when you deposit your Pokémon in the Trade Corner. Any match you receive will
    be from within that region pool. Note that "regions with compatible languages"
    refers to games that have compatible character sets, meaning either all Latin-based
    languages or Japanese by itself.
  trade-option-1: National only (only your game's region)
  trade-option-2: All regions with compatible languages
  trade-option-3: All regions, including Latin-Japanese conversion
  time-zone: Time Zone
  time-zone-blurb: Choose the time zone dates and times are shown in across the
    site. Leave the default to see everything in the game's original time zone
    (Japan, +0900).
  update-settings: Update settings
  pokemon-news-custom-opt-in: 'Pokémon News: News Preferences'
  pokemon-news-custom-opt-in-blurb: When enabled, Pokémon News downloads may use custom
    news content created by the REON Team when available. 
    If no custom news exists, official news will be used instead.
  pokemon-news-custom-opt-in-off: Official Pokémon News only
  pokemon-news-custom-opt-in-on: Custom Pokémon News when available
  mobile-stadium-custom-opt-in: 'Mobile Stadium: Content Preferences'
  mobile-stadium-custom-opt-in-blurb: When enabled, Mobile Stadium may offer custom
    battle data reconstructed by the REON Team when available. This is fan-made
    content, not official Nintendo data.
  mobile-stadium-custom-opt-in-off: Official Mobile Stadium content only
  mobile-stadium-custom-opt-in-on: Custom Mobile Stadium content when available
  gbwars-custom-opt-in: "Game Boy Wars 3: Map Preferences"
  gbwars-custom-opt-in-blurb: "When enabled, the Game Boy Wars 3 map menu also lists custom maps made by the REON Team. This is fan-made content, not official data. The official maps are always listed."
  gbwars-custom-opt-in-off: "Official maps only"
  gbwars-custom-opt-in-on: "Official and custom maps"
  adapter-settings: "Mobile Adapter"
  adapter-color: "Adapter colour"
  adapter-blurb: "Which adapter the games see when they read your mobile_config.bin. It changes the colour and the name the game shows — nothing else about how it works."
  adapter-unmetered: "Unmetered (no per-minute charge)"
  adapter-unmetered-explanation: "It tells the game the call is not charged by the minute. In Pokémon Crystal (Japanese) that removes the time limit on mobile battles. What it does in the other games is not known — nobody has documented it — so if a game behaves oddly with this on, turning it off is the first thing to try."
  rankings-opt-in: "Rankings"
  rankings-opt-in-blurb: "Whether what your game uploads may be shown to other people — on the ranking pages and in the ranking table the games display. The upload itself does not change: the cartridge sends what it sends, and the server keeps it either way."
  rankings-opt-in-on: "Show me in the rankings"
  rankings-opt-in-off: "Keep me out of the rankings"
  rankings-opt-in-note: "What is shown is the name your game uploaded, your state or province, and the message the game let you assemble from its own word list. Turning this off hides what is already there as well; turning it back on brings it back."
  birth-date: "Date of birth"
  birth-date-blurb: "Used for one thing only: deciding whether your results may be shown in the rankings. It is never displayed to anyone, and it is not what the game sends — the game has its own age field that you type inside it. You can set it once; after that it cannot be changed."
  birth-date-locked: "Already saved — it cannot be changed. Deleting your account removes it."
  birth-date-optional: "Optional — you can finish signing up without it."
  birth-date-invalid: "That is not a date we can use. Check the year."
  rankings-blocked-age: "The rankings are closed for this account: the date of birth on it is under %age%. A ranking entry shows your age, gender, state and name to every other player, which is why this one is not a choice."
  rankings-reminder: "You are not in the rankings. What your game uploads is kept, but not shown to anyone — you can change that on"
  rankings-reminder-link: "your account page"
  download-my-data: "Download my data"
  data-rights-note: "The download is everything the server holds about this account, as one JSON file, including your mail. Device keys and the relay token are named but not written out — they are live credentials, and a copy of them in a file you carry around is a copy that did not exist before."
  delete-account: "Delete account"
  delete-intro: "This removes the account and everything attached to it. There is no undo, and no grace period."
  delete-item-mail: "All mail, in the inbox and in the trash, read or not."
  delete-item-devices: "Every connected device, its pairing code, its counter and its key."
  delete-item-games: "What the games recorded: rankings, Battle Tower results, Trade Corner deposits and trades."
  delete-item-identity: "The account itself, the game address and the login ID. The address can be taken by someone else afterwards."
  delete-warning: "Mail already delivered to someone else is theirs and stays with them — deleting this account does not reach into other people's mailboxes."
  delete-export-first: "If you want a copy of any of it, take it before you delete:"
  delete-type-name: "Type %name% to confirm"
  delete-name-mismatch: "That is not the account name, exactly as written above."
  delete-confirm: "Delete this account permanently"
  delete-cancel: "Cancel"
  delete-failed: "Nothing was deleted — something went wrong on the server. The account is untouched; try again, and tell an administrator if it keeps failing."
  adapter-color-8: "Blue"
  adapter-color-9: "Yellow"
  adapter-color-11: "Red"
  adapter-following-default: "You have not chosen yet, so these are the site defaults."
  adapter-download-note: "A saved change applies to the next mobile_config.bin you download. A file already in use keeps working."
  adapter-invalid: "That is not an adapter this server knows. Nothing was changed."
