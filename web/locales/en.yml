patches-note-pokecrystal: "Before you pick this one for real hardware: the original Pokémon Crystal has a small memory manager chip inside (called MBC3). To make room for the online features, the patched game needs another version of that chip (called MBC30). Not every emulator knows about that other version: mGBA does, but some others may not, so check yours too. On real hardware, what you play on must support MBC30 too. You can test it with %test%."
