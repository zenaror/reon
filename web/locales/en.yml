passport:
  title: "Your passport to REON."
  download-hint: "Click here to download"
  intro: "This file is your passport to accessing REON's services."
  body-1: "Whether you're connecting through emulation with mGBA or using original hardware, this small configuration file contains the information your game needs to find and connect to REON."
  body-2: "Think of it as the link between your game and the REON network. Once mobile_config.bin is installed in the correct location, supported games and software can use it to connect to REON's servers and access their online functionality."
  mgba-heading: "Playing with mGBA?"
  mgba-body: "It's easy to get started! Download mobile_config.bin, then head over to the mGBA Setup Guide. We'll take you through the process step by step."
  hardware-heading: "Playing on original hardware?"
  hardware-body: "You can connect to REON from the real thing, too! Check out the Original Hardware Setup Guide to find out what you'll need and how to get connected."
  keep-heading: "Don't lose your passport!"
  keep-body: "Keep a copy of mobile_config.bin somewhere safe. You may need it again if you set up REON on another device or reinstall your emulator."
  redownload-note: "If you ever lose it, a fresh copy can be downloaded from your %link_open%My Account%link_close% page."
