  reon-username-mail-internal: "Vom Game Boy"
  reon-username-mail-external: "Aus dem Internet"
  reon-username-taken: "Dieser Name ist bereits vergeben — bitte wähle einen anderen."
  reon-username-free: "Dieser Name ist verfügbar."
  reon-username-mail-or: "oder"
  reon-username-mail-truncated: "Der Game Boy fasst nur 8 Zeichen, deshalb ist die Adresse im Spiel Ihr gekürzter Benutzername — beide erreichen dasselbe Postfach."
  region-explanation-para1: REON ermöglicht internationalen Tausch für Pokémon-Kristall-Spieler über die Spielfunktion namens Trade Corner. Das schließt Tausche zwischen japanischen und nicht-japanischen Spielen ein, die normalerweise wegen unterschiedlicher Zeichensätze inkompatibel sind. Um solche Tausche zu ermöglichen, ändert der Dienst Pokémon-Spitznamen, Trainernamen und auf Post geschriebene Nachrichten beim Zusammenführen von Pokémon zwischen japanischen und nicht-japanischen Spielen (zum Beispiel wird "A" zu "ア" geändert, und umgekehrt). Diese Änderungen sind unumkehrbar, versuchen aber, die Schreibweise der Originalsprache so originalgetreu wie möglich nachzuahmen.
  region-explanation-para2: Wähle die Region-Gruppe, mit der du tauschen möchtest. Diese Einstellung kann auch nach der Registrierung geändert werden.
  rankings-explanation-para1: "Wenn du Pokémon Kristall über den Adapter spielst, schickt uns das Spiel deine Punktzahl zusammen mit dem Namen, dem Alter und der Region, die du im Spiel eingetragen hast, dazu eine kurze Nachricht, die du aus der Wortliste des Spiels zusammengestellt hast. Dieser Teil ist nicht optional: das Spiel braucht ihn, und wir speichern ihn so oder so."
  rankings-explanation-para2: "Dieses Kästchen betrifft die anderen Spieler. Angehakt erscheinen dein Name, deine Region und deine Nachricht in den Ranglisten — denen auf dieser Seite und denen, die das Spiel selbst anzeigt. Leer gelassen zählt deine Punktzahl weiterhin für dich, aber niemand sonst sieht, wer du bist."
  rankings-explanation-para3: "Du kannst es jederzeit auf deiner Kontoseite ändern, und zwar in beide Richtungen: Ausschalten verbirgt auch das, was schon da ist, Einschalten holt es zurück. Eine Ausnahme: Steht das Alter in deinem Spiel unter 13, bleibst du aus den Ranglisten heraus, egal was hier angehakt ist."
  rankings-opt-in-check: "Ja, zeigt mich in den Ranglisten"
  rankings-opt-in-optional: "Optional — die Registrierung geht so oder so zu Ende."
  birth-date-explanation-para1: "Wir fragen danach, um zu wissen, ob du alt genug bist, in den öffentlichen Ranglisten zu erscheinen. Dort zu erscheinen zeigt allen anderen Spielern auf einmal dein Alter, dein Geschlecht, deine Region und deinen Namen — das Spiel schreibt das in eine Zeile — und das schaltet man für ein Kind nicht ein."
  birth-date-explanation-para2: "Es wird niemandem gezeigt, und nichts anderes auf der Seite verwendet es. Du kannst es leer lassen und die Registrierung trotzdem abschließen: die Ranglisten bleiben dann einfach zu, bis du es ausfüllst, was du später auf deiner Kontoseite tun kannst. Es ist auch nicht dasselbe wie das Alter, das du im Spiel eingibst — das schickt das Modul von selbst, und niemand prüft es."

