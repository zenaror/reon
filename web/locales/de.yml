homepage:
  eyebrow: Das Mobile-GB-System
  tagline: "Verbinde deinen Game Boy Color mit der Welt. Tausche, kämpfe und klettere in den Ranglisten mit Spielern überall, alles über den Mobile Adapter."
  learn-more: Mehr erfahren
  what-is-reon: Was ist REON?
  intro-1: "REON ist eine Nachbildung des Mobile-GB-Systems: ein vollständiger Onlinedienst für den Game Boy Color, der deinen Handheld mit dem Netzwerk und der weiten Welt verbindet. Es zeigt, wie eine weltweite Veröffentlichung von Nintendos Mobile System GB hätte aussehen können, ein Ort zum Tauschen, Wettkämpfen und Herunterladen, alles aus deiner Handfläche."
  intro-2: "Der Schlüssel dazu ist der Mobile Adapter. Dieses kleine Zubehör wird an den EXT-Anschluss deines Game Boy Color oder Game Boy Advance angeschlossen und verbindet ihn mit einem Mobiltelefon, sodass sich dein Handheld einwählen und die Dienste von REON von überall mit Empfang erreichen kann."
  games-services: "Spiele & Dienste"
  crystal-desc: "Erklimme die nationalen Ranglisten, triff Trainer im Trade Corner und jage die Ruhmesliste des Kampfturms, alles direkt aus der Kristall-Edition."
  gbwars-desc: "Durchstöbere die Kartengalerie und lade neue Schlachtfelder herunter, um deine Armee aufzustellen und das Kommando zu übernehmen."
  mariokart-desc: "Trage deine schnellsten Runden ein und fahre gegen Geisterdaten aus aller Welt in den Super-Circuit-Bestenlisten."
  enter: Öffnen
  top: Nach oben

