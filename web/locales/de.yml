  news-maker-regions: Bauen für
  news-maker-regions-hint: Ein Baulauf pro Region. Eine Region lässt sich erst wählen, wenn ihre Sprache Schlagzeile und Artikel hat — E, P und U nehmen alle drei den englischen Text; F und D, S und I teilen eine Zeichentabelle.
