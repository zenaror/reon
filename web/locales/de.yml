  trainer-tags-note: 'Aus der Dokumentation des Adapters, und das ist die vollständige Liste — <p>, <table> und <form> stehen nicht darauf. Nichts wird abgelehnt, weil es fehlt, denn die Dokumentation sagt nicht, was der Adapter mit einem Tag macht, das er nicht kennt. Zwei Überraschungen: <b> färbt den Text rot statt ihn fett zu setzen, und <center> wirkt nur innerhalb von <html>. Bilder sind ausschließlich 1BPP-BMP, jede Seite höchstens 255 Pixel.'
