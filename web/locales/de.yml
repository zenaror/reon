  mobile-stadium-custom-opt-in-on: Benutzerdefinierter Mobile-Stadium-Inhalt, wenn verfügbar
  gbwars-custom-opt-in: "Game Boy Wars 3: Karteneinstellungen"
  gbwars-custom-opt-in-blurb: "Wenn aktiviert, listet das Kartenmenü von Game Boy Wars 3 zusätzlich benutzerdefinierte Karten des REON-Teams auf. Das sind von Fans erstellte Inhalte, keine offiziellen Daten. Die offiziellen Karten werden immer angezeigt."
  gbwars-custom-opt-in-off: "Nur offizielle Karten"
  gbwars-custom-opt-in-on: "Offizielle und benutzerdefinierte Karten"

  adapter-settings: "Adapter"
  adapter-color: "Adapterfarbe"
  adapter-blurb: "Welchen Adapter die Spiele sehen, wenn sie deine mobile_config.bin lesen. Das ändert Farbe und Namen, die das Spiel anzeigt — sonst nichts."
  adapter-unmetered: "Pauschal (keine Abrechnung pro Minute)"
  adapter-unmetered-explanation: "Teilt dem Spiel mit, dass die Verbindung nicht pro Minute abgerechnet wird. In Pokémon Kristall (japanisch) entfällt dadurch das Zeitlimit bei Mobil-Kämpfen. Was es in den anderen Spielen bewirkt, ist nicht bekannt — niemand hat es dokumentiert — wenn sich also ein Spiel damit seltsam verhält, ist Ausschalten das Erste, was man versuchen sollte."
  rankings-opt-in: "Ranglisten"
  rankings-opt-in-blurb: "Ob das, was dein Spiel hochlädt, anderen gezeigt werden darf — auf den Ranglistenseiten und in der Ranglistentabelle, die die Spiele anzeigen. Am Hochladen selbst ändert sich nichts: Das Modul sendet, was es sendet, und der Server bewahrt es so oder so auf."
  rankings-opt-in-on: "In den Ranglisten zeigen"
  rankings-opt-in-off: "Aus den Ranglisten heraushalten"
  rankings-opt-in-note: "Gezeigt werden der von deinem Spiel übermittelte Name, dein Bundesland bzw. deine Provinz und die Nachricht, die das Spiel dich aus seiner eigenen Wortliste zusammensetzen ließ. Ausschalten verbirgt auch das bereits Vorhandene; Wiedereinschalten holt es zurück."
  birth-date: "Geburtsdatum"
  birth-date-blurb: "Es dient nur einem Zweck: zu entscheiden, ob deine Ergebnisse in den Ranglisten erscheinen dürfen. Es wird niemandem gezeigt, und es ist nicht das, was das Spiel sendet — das Spiel hat ein eigenes Altersfeld, das du dort eingibst. Du kannst es einmal festlegen; danach lässt es sich nicht mehr ändern."
  birth-date-locked: "Bereits gespeichert — es kann nicht geändert werden. Beim Löschen des Kontos wird es mit entfernt."
  birth-date-optional: "Optional — die Registrierung geht auch ohne."
  birth-date-invalid: "Dieses Datum lässt sich nicht verwenden. Prüfe das Jahr."
  rankings-blocked-age: "Die Ranglisten sind für dieses Konto geschlossen: das Geburtsdatum liegt unter %age%. Ein Ranglisteneintrag zeigt allen anderen Spielern dein Alter, dein Geschlecht, deine Region und deinen Namen — deshalb ist das hier keine Wahl."
  rankings-reminder: "Du stehst nicht in den Ranglisten. Was dein Spiel hochlädt, wird aufbewahrt, aber niemandem gezeigt — ändern kannst du das auf"
  rankings-reminder-link: "deiner Kontoseite"
  download-my-data: "Meine Daten herunterladen"
  data-rights-note: "Der Download enthält alles, was der Server über dieses Konto speichert, in einer einzigen JSON-Datei, einschließlich deiner Post. Geräteschlüssel und Relay-Token werden genannt, aber nicht ausgeschrieben: Das sind aktive Zugangsdaten, und eine Kopie davon in einer Datei, die du mit dir herumträgst, ist eine Kopie, die es vorher nicht gab."
  delete-account: "Konto löschen"
  delete-intro: "Dies entfernt das Konto und alles, was daran hängt. Ohne Rückgängigmachen und ohne Schonfrist."
  delete-item-mail: "Die gesamte Post, im Posteingang und im Papierkorb, gelesen oder nicht."
  delete-item-devices: "Jedes verbundene Gerät, mit Kopplungscode, Zähler und Schlüssel."
  delete-item-games: "Was die Spiele aufgezeichnet haben: Ranglisten, Duellturm-Ergebnisse, Trade-Corner-Einlagen und -Tauschvorgänge."
  delete-item-identity: "Das Konto selbst, die Spieladresse und die Anmelde-ID. Die Adresse kann danach von jemand anderem übernommen werden."
  delete-warning: "Post, die bereits jemand anderem zugestellt wurde, gehört dieser Person und bleibt dort — das Löschen dieses Kontos reicht in kein fremdes Postfach."
  delete-export-first: "Wenn du eine Kopie davon möchtest, hol sie dir vor dem Löschen:"
  delete-type-name: "Gib %name% ein, um zu bestätigen"
  delete-name-mismatch: "Das ist nicht der Kontoname, genau so wie er oben steht."
  delete-confirm: "Dieses Konto endgültig löschen"
  delete-cancel: "Abbrechen"
  delete-failed: "Es wurde nichts gelöscht — auf dem Server ging etwas schief. Das Konto ist unberührt; versuch es erneut und sag einer Administratorin oder einem Administrator Bescheid, wenn es weiter fehlschlägt."
