  mailauth-title: "Anmeldung am Postfach"
  mailauth-explain: "Der Adapter weist sich mit dem 256-Bit-Geräteschlüssel aus (APOP); das Passwort geht nie über die Leitung. Das achtstellige Passwort ist der alte Weg und bleibt nur für Adapter, die noch kein APOP sprechen. Schließen Sie ihn, sobald die neuen Versionen bei den Spielern sind: acht Zeichen lassen sich raten, und wer die schwache Tür neben der starken offen lässt, sorgt dafür, dass Angreifer die schwache nehmen."
