  news-maker-title: Pokémon News
  news-maker-intro: Eine Ausgabe ist ein kleines Programm, das das Spiel ausführt, gebaut mit der echten Werkzeugkette. Sie wählen die Worte, die Ranglisten und das Minispiel; alles andere kommt aus einer Ausgabe, von der bekannt ist, dass sie funktioniert.
  news-maker-unavailable: 'Bauen noch nicht möglich — es fehlt:'
  news-maker-new: Neue Ausgabe
  news-maker-back: Zurück zu den Ausgaben
  news-maker-none: Es wurde noch keine Ausgabe erstellt.
  news-maker-issue: Ausgabe
  news-maker-rankings: Ranglisten
  news-maker-built: Gebaut für
  news-maker-not-built: nicht gebaut
  news-maker-name: Name
  news-maker-name-hint: Für Sie und für den Dateinamen. Wird im Spiel nicht angezeigt.
  news-maker-message: Zeile im Briefkasten
  news-maker-message-hint: Die einzige Zeile, die der Briefkasten des Spiels zu dieser Ausgabe zeigt, bevor sie jemand öffnet. Bleibt sie leer, wird die Schlagzeile dieser Sprache verwendet. Höchstens %n% Zeichen, und in den eigenen Zeichen des Spiels geschrieben — was es nicht zeichnen kann, wird mit Namen abgelehnt.
  news-maker-schedule-locked: Ausgaben lassen sich bauen, aber noch nicht einplanen.
  news-maker-schedule-why: 'Der Kalender für eigene Ausgaben ist eine Datei für sich, und der Webserver kann sie nicht schreiben. Absichtlich ist es nicht die Konfiguration daneben: die trägt auch den Plan der gewöhnlichen Nachrichten, und den zu ändern ist nicht die Sache dieses Bereichs:'
  news-maker-built-only: gebaut, aber nicht im Kalender — kein Spieler sieht es
  month-1: Januar
  month-2: Februar
  month-3: März
  month-4: April
  month-5: Mai
  month-6: Juni
  month-7: Juli
  month-8: August
  month-9: September
  month-10: Oktober
  month-11: November
  month-12: Dezember
  news-maker-date: Erscheint am
  news-maker-date-hint: Der Tag, an dem diese Ausgabe übernimmt; sie erscheint weiter, bis der Tag einer anderen kommt. Sie wählen Monat und Tag; das Jahr ist das laufende, ein noch kommender Tag wartet also, statt sofort zu erscheinen. Der Februar endet am 28., weil ein 29. nur in einem Schaltjahr vorkäme.
  news-maker-withdraw: Zurückziehen
  news-maker-withdrawn: Zurückgezogen. Das Spiel verwendet sie nicht mehr.
  news-maker-withdraw-confirm: Diese Ausgabe aus dem Kalender nehmen und das Gebaute löschen? Sie erscheint nicht mehr — die Nachrichtenzeile behält ihren Inhalt aber, bis die gewöhnlichen Nachrichten diese Region das nächste Mal wechseln, denn dann spiegelt der Planer sie neu.
  news-maker-lang-j: Japanisch
  news-maker-lang-e: Englisch
  news-maker-lang-d: Deutsch
  news-maker-lang-f: Französisch
  news-maker-lang-i: Italienisch
  news-maker-lang-s: Spanisch
  news-maker-scheduled: Im Kalender
  news-maker-template: Beruht auf
  news-maker-template-hint: Die echte Ausgabe, deren Menüs, Skripte und Aufbau diese übernimmt.
  news-maker-minigame: Minispiel
  news-maker-minigame-broken: "Dieses Minispiel lässt sich mit der aktuellen Toolchain nicht bauen — im Quelltext des Minispiels selbst steckt ein Fehler, upstream. Es gibt keinen Preis zur Auswahl, und eine Ausgabe kann damit nicht veröffentlicht werden. Bitte ein anderes wählen."
  news-maker-publish-now-unbuilt: Diese Ausgabe wurde noch nicht gebaut. Öffnen Sie sie, wählen Sie die Sprachen und drücken Sie zuerst Veröffentlichen.
  news-maker-published-now: Jetzt live in %regions%.
  news-maker-prizes: Preise
  news-maker-prizes-hint: Was das Minispiel bei einem Sieg aushändigt. Die Liste wird aus dem Code des Minispiels selbst gelesen, ein anderes Minispiel ergibt also eine andere Liste. Die gesamte Gegenstandstabelle steht zur Wahl, Schlüsselgegenstände eingeschlossen — das Modul kennt sie, doch das Spiel rechnet nicht damit, einen davon aus den Nachrichten zu erhalten.
  news-maker-prize: Preis %n%
  news-maker-prize-default: "wie vorgesehen: %item%"
  news-maker-prize-fixed: Das wählt das Minispiel.
  news-maker-prize-none: Dieses Minispiel händigt keinen Preis aus.
  news-maker-bad-prize: "Diesen Gegenstand gibt es nicht:"
  news-maker-headline-hint: Der Name der Ausgabe auf dem Nachrichtenbildschirm selbst — auf dem Banner, während die Konsole sie lädt, und als Titel oben auf der Seite. Höchstens %n% Zeichen, so viel wie die breiteste echte Ausgabe nutzt.
  news-maker-body-hint: 'Der Text hinter „Nachrichtenführer“ — der Artikel, den der Spieler liest. Eine leere Zeile beginnt einen Absatz; die erste Zeile öffnet das Textfeld, die zweite steht darunter, der Rest läuft durch. **%n% Zeichen pro Zeile**, weil das Textfeld %n% Kacheln breit ist. Keine Grenze für die Anzahl der Zeilen: der Text läuft durch.'
  news-maker-random: ZUFÄLLIGE RANGLISTE
  news-maker-ranking-hint: 'Die drei Ranglisten, um die es in dieser Ausgabe geht. „ZUFÄLLIGE RANGLISTE“ zieht beim Speichern eine Kategorie, und das Gezogene bleibt: dieselbe Ausgabe wechselt zwischen zwei Bauläufen nicht die Ranglisten. Die drei müssen sich unterscheiden, denn sie stehen auf einem Bildschirm nebeneinander.'
  news-maker-duplicate-ranking: Die drei Ranglisten müssen sich voneinander unterscheiden.
  news-maker-no-categories: Es gibt nicht genug Ranglistenkategorien für die drei Plätze.
  news-maker-unknown-ranking: Das ist keine Ranglistenkategorie, die diese Werkzeugkette kennt.
  news-maker-too-long: 'Zu lang für den Bildschirm:'
  news-maker-region-empty: 'Eine Region, deren Sprache keinen Text hat, lässt sich nicht bauen — sie käme nicht leer heraus, sondern mit dem Artikel der Vorlage von 2002:'
  news-maker-region-needs: Schreiben Sie zuerst die Schlagzeile und den Artikel auf %lang%.
