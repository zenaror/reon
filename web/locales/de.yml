  adapter-color-9: "Gelb"
  adapter-color-11: "Rot"
  adapter-following-default: "Du hast noch nicht gewählt, daher gelten die Vorgaben der Seite."
  adapter-download-note: "Die Änderung gilt für die nächste heruntergeladene mobile_config.bin. Eine bereits genutzte Datei funktioniert weiter."
  adapter-invalid: "Das ist kein Adapter, den dieser Server kennt. Es wurde nichts geändert."
