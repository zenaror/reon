# Updated on 2026-09-24 against production, service by service. What was
# here before described an August system: no mobile-relay, no relay policy,
# the built-in mail server answering 25 and 110, and none of the PHP jobs.
#
# WARNING, and this applies to the whole file: production does NOT run in a
# container. It is native, under systemd, and it is the reference -- this
# compose file is a translation of it, not the other way around. When they
# diverge, production is right.
#
# Two pieces deliberately left OUT of here: Postfix and Dovecot. They have
# answered 25 and 110 in production since 2026-09-12, set up by
# setup-script/2-setup-postfix-bridge.sh, and containerising them would mean
# rewriting mail delivery, not packaging it. In a Docker-only environment,
# mail between players does not work.

services:

  db:
    image: mysql:8.4.11
    ports:
      - 3306:3306
    volumes:
      # Run tables.sql on startup (only for fresh databases)
      #- ./tables.sql:/docker-entrypoint-initdb.d/tables.sql:ro
      - reon_db:/var/lib/mysql
    environment:
      - MYSQL_USER
      - MYSQL_PASSWORD
      - MYSQL_DATABASE
      - MYSQL_ROOT_PASSWORD
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      timeout: 5s
      retries: 10
      interval: 3s

  migrate:
    build:
      dockerfile: Dockerfile
      target: migrate
    volumes:
      - ./config.json:/var/www/reon/config.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Node jobs. See app/docker.crontab: mirrors four systemd timers.
  cron:
    build:
      dockerfile: Dockerfile
      target: cron
    volumes:
    - "./config.json:/app/config.json"
    - ./web:/web
    depends_on:
      migrate:
        condition: service_completed_successfully

  # PHP jobs. See app/docker-php.crontab: mirrors the other four timers,
  # which existed nowhere in Docker before 2026-09-24.
  cron-php:
    build:
      dockerfile: Dockerfile
      target: cron-php
    volumes:
      - ./config.json:/var/www/reon/config.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      dockerfile: Dockerfile
      target: web
    volumes:
      - ./config.json:/var/www/reon/config.json:ro
      - ./web/:/var/www/reon/web
      # Preserve composer deps built into the image; the bind mount above would
      # otherwise shadow vendor/ (breaking the website + scripts/add_user.php).
      - /var/www/reon/web/vendor
    tmpfs:
      - /tmp/reon
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.28.3
    volumes:
      - ./examples/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
      - ./web/:/var/www/reon/web
    ports:
      - 80:80
      # Production also answers 443, with a Let's Encrypt certificate
      # renewed by webroot. Not here because a certificate does not get
      # packaged: serving TLS in a container needs /etc/letsencrypt mounted
      # from outside.
      #- 443:443
    environment:
      - NGINX_PORT=80
      - NGINX_HOST="_"
      # Hostname and port for fastcgi_pass directive
      - WEB_URL=web:9000
    depends_on:
      - web
    # MISSING HERE, and it is a real gap against production: bot blocking.
    # In production it is three layers -- robots.txt, the X-Robots-Tag
    # header, and a 403 by User-Agent in nginx, set up by
    # setup-script/4-harden-bots.sh. Only the first ships in the
    # repository; this compose's template has neither of the other two.
    # See the script for what needs to be generated.

  # Mail's side effects: the Sent copy and the bell entry. NOT a mail
  # server -- see the comment on the `mail` target in the Dockerfile.
  mail:
    build:
      dockerfile: Dockerfile
      target: mail
    # No `ports`: 10046 is internal, Postfix is the one that talks to it.
    # 25, 110 and 587 used to be published here; today they belong to
    # Postfix and Dovecot -- publishing them would conflict on port with
    # them.
    expose:
      - 10046
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Postfix's policy delegation: it asks whether a send may go out. Active
  # service in production (reon-relay-policy.service) and missing from this
  # file until 2026-09-24.
  relay-policy:
    build:
      dockerfile: Dockerfile
      target: relay-policy
    expose:
      - 10045
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  dns:
    build:
      dockerfile: Dockerfile
      target: dns
    ports:
      - 53:53/udp
    environment:
      - EXTERNAL_IP

  # The adapter's relay: this is what the Game Boy calls. Lives in ANOTHER
  # repository, next to this one, with its own Dockerfile and compose file --
  # so this service only comes up if its sibling is in place. Uncomment if
  # it is.
  #
  # In production it runs as reon-mobile-relay.service, in a Python venv,
  # and tournament mode records sessions into a state directory
  # (StateDirectory=, /var/lib/reon-captures). The volume below is the
  # equivalent of that: without it, recordings die with the container and
  # the admin panel finds nothing.
  #mobile-relay:
  #  build:
  #    context: ../mobile-relay
  #  ports:
  #    - 31227:31227/tcp
  #  volumes:
  #    - ../mobile-relay/config.ini:/app/config.ini:ro
  #    - reon_captures:/var/lib/reon-captures
  #  environment:
  #    - PYTHONUNBUFFERED=1
  #    # Required, and the failure without it is silent: the relay resolves
  #    # the recording directory through $STATE_DIRECTORY, which systemd
  #    # sets in production and Docker does not. Without it, it writes
  #    # inside the image and the volume above stays empty.
  #    - STATE_DIRECTORY=/var/lib/reon-captures
  #  depends_on:
  #    migrate:
  #      condition: service_completed_successfully

volumes:
  reon_db:
    name: reon_db
  # Tournament-mode recordings. Named so it survives `docker compose down`:
  # this is the conversation between two consoles that someone will convert
  # into a replay later.
  reon_captures:
    name: reon_captures
